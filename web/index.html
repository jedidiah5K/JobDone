:root {
  --bg: #000000;
  --surface: #0F0F10;
  --raised: #1A1A1C;
  --border: #262628;
  --text: #FFFFFF;
  --text2: #9E9EA0;
  --muted: #6B6B6E;
  --accent: #D4FF3A;
  --accent-ink: #000000;
  --pos: #1EAA52;
  --neg: #FF4A3D;
  --neu: #9E9EA0;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, system-ui, "Segoe UI", Roboto, sans-serif;
  --num: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --display: "Bebas Neue", "Anton", Impact, "Arial Narrow", sans-serif;
  --r: 0px;
  --tabh: 64px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
* { box-sizing: border-box; }
button, label, summary, a { touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sec { color: var(--text2); }
.pos { color: var(--pos); } .neg { color: var(--neg); } .neu { color: var(--neu); }
.acc { color: var(--accent); }

#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; }
#screen {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(var(--tabh) + 40px + env(safe-area-inset-bottom, 0px));
}
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* Type: billboard above, catalog below */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 12px 0 8px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 400; font-size: 54px; line-height: .9; text-transform: uppercase; margin: 6px 0 0; letter-spacing: .005em; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 600; margin: 8px 0 0; letter-spacing: -.01em; }
h3 { font-size: 16px; font-weight: 600; margin: 0; }
.cap { font-size: 13px; color: var(--text2); }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--text2); font-size: 15px; min-height: 44px; font-weight: 500; }
.hero { font-family: var(--display); font-size: 96px; line-height: .86; text-transform: uppercase; letter-spacing: .005em; overflow-wrap: anywhere; }

/* Sections: flat, separated by a hairline, never a floating box */
.card { background: transparent; border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 18px 0 6px; min-width: 0; color: inherit; }
.card.tight { padding: 12px 0 4px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.big { font-family: var(--display); font-variant-numeric: tabular-nums; font-size: 92px; font-weight: 400; letter-spacing: 0; line-height: .85; }
.mid { font-family: var(--display); font-variant-numeric: tabular-nums; font-size: 46px; font-weight: 400; letter-spacing: .005em; line-height: .9; text-transform: uppercase; }
.unit { font-family: var(--font); font-size: 15px; font-weight: 600; color: var(--text2); margin-left: 6px; letter-spacing: 0; text-transform: none; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--border); margin-top: 16px; }
.kpi { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 12px 0 2px; }
.kpi + .kpi { border-left: 1px solid var(--border); padding-left: 14px; }
.kpi b { font-family: var(--display); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 400; line-height: .9; }
.kpi span { font-size: 12px; color: var(--text2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--border); }
.grid2 > .card { border-top: 0; }
.grid2 > .card + .card { border-left: 1px solid var(--border); padding-left: 16px; }

/* Buttons: pill or circle, nothing else */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 24px; border-radius: 999px; background: var(--raised); border: 0; font-weight: 600; font-size: 16px; color: var(--text); }
.btn.primary { background: var(--text); color: #000; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--border); }
.btn.danger { color: var(--neg); }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 0 16px; font-size: 14px; }
.btn:disabled { opacity: .35; }
.link { color: var(--text2); font-size: 14px; min-height: 44px; display: inline-flex; align-items: center; text-decoration: underline; text-underline-offset: 3px; }
.icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; color: var(--text2); flex: none; }
.icon-btn:disabled { opacity: .3; }
.icon-btn:active, .btn:active { transform: scale(.96); opacity: .8; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--raised); font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; }
.chip.on { color: #000; background: var(--text); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.seg { display: flex; background: var(--surface); border: 0; border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-height: 36px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--text2); }
.seg button.on { background: var(--text); color: #000; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--raised); color: var(--text2); }
.pill.pr { background: var(--accent); color: var(--accent-ink); }

/* Lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); min-height: 56px; text-align: left; width: 100%; }
.li:last-child { border-bottom: 0; }
.li .t { font-weight: 550; }
.li .s { font-size: 13px; color: var(--text2); }
.chev { color: var(--muted); flex: none; }

/* Fields */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-size: 13px; color: var(--text2); }
.input { width: 100%; min-height: 48px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 0 14px; font-size: 16px; }
.input:focus { border-color: var(--text2); outline: none; }
textarea.input { padding: 12px 14px; min-height: 80px; resize: vertical; }
.input.sm { min-height: 40px; padding: 0 10px; font-size: 16px; border-radius: 12px; } /* 16px stops iPhone zooming in on tap */

/* Tab bar */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-width: 560px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  background: rgba(0, 0, 0, .82); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
  box-shadow: inset 0 1px 0 var(--border);
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); min-height: 50px; justify-content: center; font-weight: 600; }
.tab.on { color: var(--text); }
.tab svg { width: 24px; height: 24px; }
.tab-start { justify-self: center; width: 56px; height: 56px; border-radius: 999px; background: var(--text); color: #000; display: flex; align-items: center; justify-content: center; }
.tab-start svg { width: 26px; height: 26px; }
.tab-start.live { background: var(--accent); }

/* Today */
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--num); font-size: 14px; font-weight: 650; color: var(--text2); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week .d { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); font-weight: 600; }
.dot { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #000; }
.dot.done { background: var(--text); border-color: var(--text); color: #000; }
.dot.miss { border-color: var(--neg); color: var(--neg); }
.dot.today { border-color: var(--text); }
.dot.future { opacity: .4; }
.nextlist { margin-top: 14px; border-top: 1px solid var(--border); }
.nextlist .row { font-size: 14px; padding: 9px 0; border-bottom: 1px solid var(--border); }

/* Charts */
.chart { position: relative; width: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font); }
.chart .tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--text); color: #000; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: none; font-family: var(--num); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); grid-auto-columns: minmax(6px, 1fr); gap: 3px; }
.heat i { aspect-ratio: 1; max-width: 100%; border-radius: 2px; background: var(--raised); display: block; }

    for (const e of w.ex) { const mu = exInfo(e.name).muscle; const n = e.sets.filter(s => s.t !== 'warm').length * (sideOf(e.name) ? 0.5 : 1); const o = setsBy[k] || (setsBy[k] = {}); o[mu] = (o[mu] || 0) + n; }
  }
  const conv = v => U() === 'lb' ? v * LB : v;
  const bars = weeks.map(k => ({ v: conv(vol[k] || 0), label: fmtDate(k).replace(/ \w+$/, m => ''), tip: 'Week of ' + fmtDate(k) + ' · ' + n0(conv(vol[k] || 0)) + ' ' + U(), hi: k === m0 }));
  bars.forEach((b, i) => { b.label = i % 3 === 0 || i === bars.length - 1 ? fmtDate(weeks[i]) : ''; });
  const cur = setsBy[m0] || {}, prev4 = {};
  for (let i = 1; i <= 4; i++) { const o = setsBy[addDays(m0, -7 * i)] || {}; for (const [k, v] of Object.entries(o)) prev4[k] = (prev4[k] || 0) + v / 4; }
  const musc = MUSCLES.filter(m => (cur[m] || 0) + (prev4[m] || 0) > 0);
  const mx = Math.max(1, ...musc.map(m => Math.max(cur[m] || 0, prev4[m] || 0)));
  const zero = ['Chest', 'Back', 'Shoulders', 'Quads', 'Hamstrings'].filter(m => !(cur[m] > 0));
  const vals = musc.map(m => cur[m] || 0).filter(v => v > 0);

  }
  return `<div class="card"><div class="card-h"><span class="eyebrow">Weekly volume</span><span class="cap">${U()} lifted, last 12 weeks</span></div>${barChart({ bars, h: 160, yfmt: v => v >= 1000 ? trim(v / 1000) + 'k' : n0(v) })}</div>
  <div class="card"><div class="card-h"><span class="eyebrow">Sets per muscle</span><span class="cap">this week · <span style="color:var(--muted)">▮</span> 4-week avg</span></div>
    <div class="stack" style="gap:8px">${musc.map(m => `<div class="hbar"><span class="sec">${m}</span><div class="b" style="position:relative"><i style="width:${(cur[m] || 0) / mx * 100}%;background:var(--text)"></i><span style="position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--muted);left:${(prev4[m] || 0) / mx * 100}%"></span></div><span class="num" style="text-align:right">${trim(cur[m] || 0)}</span></div>`).join('') || '<div class="empty">No sets this week yet.</div>'}</div>
    ${note ? `<div class="note" style="margin-top:12px">${note}</div>` : ''}

}
function progHistory() {
  const ws = ix().ws.slice().reverse();

  const vols = {}; Object.values(S.workouts).forEach(w => { vols[w.date] = w.skipped ? (vols[w.date] || -1) : (Math.max(0, vols[w.date] || 0) + wVol(w)); });
  const vmax = Math.max(1, ...Object.values(vols));
  let cells = '';
  for (let d = m0; d <= addDays(mondayOf(end), 6); d = addDays(d, 1)) {
    const v = vols[d]; let cls = d > end ? 'out' : '';

    cells += `<i class="${cls}" title="${esc(fmtDate(d, { wd: true }))}"></i>`;
  }
  let lastM = '', list = '';

    if (m !== lastM) { list += `${lastM ? '</div></div>' : ''}<div class="card"><div class="eyebrow" style="margin-bottom:4px">${MON[+m.slice(5) - 1]} ${m.slice(0, 4)}</div><div class="list">`; lastM = m; }

// ---------- active workout ----------
function newExEntry(name, nSets, rest, tip) {
  const last = lastSession(name);
  const src = last ? last.sets : [];
  const n = Math.max(nSets || 0, src.length) || 2;
  const sets = [];
  for (let i = 0; i < n; i++) {
    const p = src[i] || src[src.length - 1];
    sets.push({ w: p ? p.w : null, r: p ? p.r : null, t: 'work', done: false });
  }
  return { name, rest: rest || S.profile.defaultRest, tip: tip || '', note: '', sets, key: uid() };
}
function startWorkout(splitId) {
  if (A) { openWk(); return; }
  const sp = splitId ? splitById(splitId) : null;
  A = { id: uid(), splitId: sp ? sp.id : null, splitName: sp ? sp.name : 'Workout', start: Date.now(), touched: Date.now(), ex: sp ? sp.ex.map(e => newExEntry(e.name, e.sets, e.rest, e.note)) : [], orig: sp ? sp.ex.map(e => e.name) : [], view: 'log' };
  persist('jd/active'); openWk();
  if (!sp) pickExercise(name => { A.ex.push(newExEntry(name)); touchA(); });
}
function touchA() { A.touched = Date.now(); persist('jd/active'); renderWorkout(); }
let wakeLock = null;
async function openWk() {

  try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
function minimizeWk() { if (A) A.open = false; if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } render(); }
function ghostVol() {
  if (!A || !A.splitId) return 0;
  const sp = splitById(A.splitId); const l = sp && lastOfSplit(sp); return l ? wVol(l) : 0;
}
const doneVol = () => A.ex.reduce((a, e) => a + exVol(e.sets.filter(s => s.done)), 0);
function livePR(e) {
  const b = clone(ix().best[e.name] || emptyBest()); const out = [];
  for (const s of e.sets) { if (!s.done) { out.push([]); continue; } out.push(prTypes(s, b)); applyBest(s, b); }
  return out;
}
function renderWorkout() {

  el.hidden = false;
  if (A.view === 'summary') { el.innerHTML = summaryHTML(); return; }
  const body = el.querySelector('.wk-body'); const keep = body ? body.scrollTop : 0;
  const gv = ghostVol(), dv = doneVol(), totalSets = A.ex.reduce((a, e) => a + e.sets.length, 0), doneSets = A.ex.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
  const scale = Math.max(gv, dv, 1);
  el.innerHTML = `<div class="wk-head"><div class="row between"><button class="icon-btn" data-a="minWk" aria-label="Minimise workout">${I.down}</button>
      <div style="text-align:center" class="grow"><div class="wkname">${esc(A.splitName)}</div><div class="cap num" data-elapsed>${fmtDur(Date.now() - A.start)}</div></div>
      <button class="btn sm primary" data-a="finish">Finish</button></div>
    <div class="row between" style="margin-top:8px;font-size:13px"><span class="sec"><b class="num" style="color:var(--text)">${dvol(dv)}</b> ${U()} lifted</span><span class="sec"><b class="num" style="color:var(--text)">${doneSets}</b> / ${totalSets} sets</span>${gv ? `<span class="${dv >= gv ? 'pos' : 'sec'}">${dv >= gv ? 'Past last time' : dvol(gv - dv) + ' to match last'}</span>` : ''}</div>
    ${gv ? `<div class="race" aria-hidden="true"><i class="ghost" style="width:${gv / scale * 100}%"></i><i class="me ${dv >= gv ? 'ahead' : ''}" style="width:${dv / scale * 100}%"></i></div>` : ''}
  </div>

function parseStepText(txt) {
  const out = {};
  for (const line of txt.split(/\r?\n/)) {
    const L = line.trim(); if (!L) continue;
    let d = null; const iso = L.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (iso) d = iso[0];
    else { const p = Date.parse(L.replace(/\s+[\d,.]+\s*(steps?)?\s*$/i, '').replace(/\bat\b.*$/i, '')); if (!isNaN(p)) d = ymd(new Date(p)); }
    const nm = L.replace(iso ? iso[0] : '', '').match(/([\d][\d,.]*)\s*(steps?)?\s*$/i);
    if (d && nm) { const v = Math.round(parseFloat(nm[1].replace(/,/g, ''))); if (v >= 0 && v < 200000) out[d] = (out[d] || 0) + v; }
  }
  return out;
}

// log: [{d, s, skip, x: [[exercise, [[w, r], ...], note], ...]}] → state with splits built from each split's latest session
function buildFromLog(log) {

  for (const n of names) {
    const sessions = log.filter(o => o.s === n && !o.skip).sort((a, b) => a.d < b.d ? -1 : 1);
    const last = sessions[sessions.length - 1];
    st.splits.push({ id: 'sp-' + n.toLowerCase().replace(/[^a-z0-9]+/g, '-'), name: n, color: SPLIT_COLORS[n] || PALETTE[st.splits.length % PALETTE.length], archived: false, ex: last ? last.x.map(([name, sets]) => ({ name, sets: Math.max(2, sets.length), repMin: 6, repMax: 10, rest: 120, note: '' })) : [] });
  }

  st.rotation = ['Push', 'Pull'].map(n => byName(n)).filter(Boolean).map(s => s.id);
  log.forEach((o, i) => {

}

// ---------- CSV import / export ----------
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function csvToWorkouts(text) {
  const rows = parseCSV(text); if (rows.length < 2) return { err: 'That file has no rows.' };
  const h = rows[0].map(x => x.trim().toLowerCase());
  const col = (...names) => { for (const n of names) { const i = h.indexOf(n); if (i >= 0) return i; } return -1; };
  const c = { date: col('date', 'start_time'), split: col('split', 'split_name', 'workout name', 'title'), ex: col('exercise', 'exercise name', 'exercise_title'), w: col('weight_kg', 'weight', 'weight (kg)'), r: col('reps'), note: col('notes', 'note', 'exercise_notes') };
  if (c.date < 0 || c.ex < 0) return { err: 'Couldn’t find date and exercise columns. Expected JobDone, Strong or Hevy CSV headers.' };
  const map = {};
  for (const r of rows.slice(1)) {
    const raw = (r[c.date] || '').trim(); let d = (raw.match(/\d{4}-\d{2}-\d{2}/) || [])[0];
    if (!d) { const p = Date.parse(raw); if (!isNaN(p)) d = ymd(new Date(p)); }
    if (!d) continue;
    const sp = c.split >= 0 ? (r[c.split] || '').trim() || 'Workout' : 'Workout';
    const key = d + '|' + sp; const w = map[key] || (map[key] = { date: d, splitName: sp, ex: [], skipped: false });
    const ex = (r[c.ex] || '').trim();
    if (!ex) { if (/skip/i.test(r[c.note] || '')) w.skipped = true; continue; }
    let e = w.ex[w.ex.length - 1]; if (!e || e.name !== ex) { e = { name: ex, note: '', sets: [] }; w.ex.push(e); }
    const wt = parseFloat(r[c.w]), rp = parseInt(r[c.r], 10);
    e.sets.push({ w: isNaN(wt) ? null : wt, r: isNaN(rp) ? null : rp, t: 'work' });
    const nt = c.note >= 0 ? (r[c.note] || '').trim() : ''; if (nt && !e.note) e.note = nt;
  }
  return { list: Object.values(map) };
}

      ${dates.length ? `<div class="cap">${fmtDate(dates[0], { y: true })} to ${fmtDate(dates[dates.length - 1], { y: true })}. Weights are read as kg.</div>` : ''}
      ${unknown.length ? `<div class="note">New exercise names (added as custom): ${esc(unknown.join(', '))}</div>` : ''}

function exportCSV() {
  const lines = ['date,split,exercise,set_number,weight_kg,reps,notes'];
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  for (const w of Object.values(S.workouts).sort(sortW)) {
    if (w.skipped) { lines.push([w.date, q(w.splitName), '', '', '', '', 'skipped'].join(',')); continue; }
    for (const e of w.ex) e.sets.forEach((s, i) => lines.push([w.date, q(w.splitName), q(e.name), i + 1, s.w == null ? '' : s.w, s.r == null ? '' : s.r, q(e.note || '')].join(',')));

  return lines.join('\n') + '\n';

async function doExport(kind) {

    const url = URL.createObjectURL(new Blob([data], { type: kind === 'json' ? 'application/json' : 'text/csv' }));
