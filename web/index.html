/* JobDone design system v7 (Oct 2026): "theme header".
   Job picked look C from three directions. The app reads like a native iPhone app:
   solid, opaque cards on a calm background, iOS type sizes, one spacing grid, three corner radii.
   Each theme keeps its scenery, but only as a band behind the screen title, never behind data.

   Rules: spacing comes from --s*, radii from --r*, type from the six text styles below,
   colours from the tokens. Static inline styles are not used in app.js; utilities at the end. */


/* ============ 1. Tokens ============ */
:root {
  /* spacing (4-pt grid) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;
  /* radii: controls, cards, sheets */
  --r1: 10px; --r2: 14px; --r3: 20px;
  --r: var(--r2);
  /* type */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
  --num: var(--font); --mono: var(--font);
  /* colour: light base (Climbing) */
  --bg: #F2EFEA;
  --surface: #FFFFFF; --surface-solid: #FFFFFF;
  --raised: rgba(118, 112, 128, .1);     /* fills: inputs, keys, tracks */
  --border: rgba(60, 50, 70, .11);       /* hairline separators */
  --edge: rgba(60, 50, 70, .2);
  --text: #16151A; --text2: rgba(52, 48, 62, .66); --muted: rgba(52, 48, 62, .4);
  --accent: #5B3CC4; --accent-dark: #43299A; --accent-ink: #FFFFFF;
  --yellow: #E0A526; --green: #23955A; --red: #D8432F; --blue: #3E7BD9; --cyan: #3E7BD9; --violet: #5B3CC4;
  --pos: #23955A; --neg: #D8432F; --neu: rgba(52, 48, 62, .66);
  --pr: #E0A526;
  --shadow: 0 1px 2px rgba(20, 16, 30, .05), 0 6px 20px rgba(20, 16, 30, .05);
  --lift: var(--shadow);
  --hdr-ink: #16151A; --hdr-ink2: rgba(22, 21, 26, .6);
  --band-h: calc(env(safe-area-inset-top, 0px) + 236px);
  --tabh: 50px;
  --ease: cubic-bezier(.2, .8, .2, 1); --spring: var(--ease);
  color-scheme: light;
}

/* ============ 2. Base ============ */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 17px; line-height: 22px; font-weight: 400;
  letter-spacing: -.01em; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button, label, summary, a { touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: inherit; }
input, select, textarea { font: inherit; color: var(--text); letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r1); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .sec { color: var(--text2); }
.pos { color: var(--pos); } .neg { color: var(--neg); } .neu { color: var(--neu); } .acc { color: var(--accent); }
details > summary { list-style: none; } details > summary::-webkit-details-marker { display: none; }

/* ============ 3. Theme header band ============ */
#bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: var(--bg); }
#bg::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: var(--band-h); background: var(--band, transparent); }
#bg::after { content: ""; position: absolute; left: 0; right: 0; top: calc(var(--band-h) - 72px); height: 72px; background: linear-gradient(180deg, transparent, var(--bg)); }
#bg > * { display: none; }
#bg .land { display: block; position: absolute; left: 0; right: 0; top: 0; height: var(--band-h); background: var(--band-art, none) center bottom / 100% auto no-repeat; }
#bg .sky-stars { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--band-h) * .7); opacity: var(--stars, 0);
  background: radial-gradient(1px 1px at 12% 22%, #fff, transparent), radial-gradient(1px 1px at 31% 12%, #fff, transparent), radial-gradient(1px 1px at 52% 30%, #fff, transparent), radial-gradient(1px 1px at 68% 14%, #fff, transparent), radial-gradient(1px 1px at 84% 26%, #fff, transparent), radial-gradient(1px 1px at 92% 8%, #fff, transparent), radial-gradient(1px 1px at 22% 40%, #fff, transparent), radial-gradient(1px 1px at 76% 44%, #fff, transparent); }

/* ============ 4. Layout ============ */
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }
#screen {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(var(--s4), env(safe-area-inset-left, 0px)); padding-right: max(var(--s4), env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + var(--s3));
  padding-bottom: calc(var(--tabh) + var(--s10) + env(safe-area-inset-bottom, 0px));
}
.stack { display: flex; flex-direction: column; gap: var(--s5); }
.row { display: flex; align-items: center; gap: var(--s3); }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
#screen.enter > .stack > * { animation: fadeUp .32s var(--ease) both; }
#screen.enter > .stack > *:nth-child(2) { animation-delay: .03s; }
#screen.enter > .stack > *:nth-child(3) { animation-delay: .06s; }
#screen.enter > .stack > *:nth-child(n+4) { animation-delay: .09s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ============ 5. Type (six styles) ============ */
/* Large Title 34/41 · Title 22/28 · Headline 17/22 · Body 17/22 · Subhead 15/20 · Caption 13/18 */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s3); padding: var(--s3) var(--s1) var(--s2); min-height: 96px; color: var(--hdr-ink); }
.top .eyebrow { color: var(--hdr-ink2); }
.top .btn.sm { background: color-mix(in srgb, var(--hdr-ink) 14%, transparent); color: var(--hdr-ink); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 41px; margin: 2px 0 0; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 22px; line-height: 28px; font-weight: 600; margin: var(--s2) 0 0; letter-spacing: -.015em; }
h3 { font-size: 17px; line-height: 22px; font-weight: 600; margin: 0; }
.hero { display: flex; align-items: center; gap: var(--s2); font-family: var(--font-display); font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -.02em; overflow-wrap: anywhere; margin-top: var(--s1); }
.eyebrow { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--text2); letter-spacing: 0; }
.cap { font-size: 13px; line-height: 18px; color: var(--text2); }
.lbl, .field label { font-size: 13px; line-height: 18px; color: var(--text2); font-weight: 600; }
.big { font-variant-numeric: tabular-nums; font-family: var(--font-display); font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -.02em; }
.mid { font-variant-numeric: tabular-nums; font-family: var(--font-display); font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -.015em; }
.unit { font-size: 15px; font-weight: 500; color: var(--text2); margin-left: 3px; letter-spacing: 0; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 41px; letter-spacing: -.02em; color: var(--text); }
.wordmark span { color: var(--accent); }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--hdr-ink); font-size: 17px; min-height: 44px; font-weight: 400; }
.grp { padding: var(--s4) var(--s4) var(--s2); font-size: 13px; line-height: 18px; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; color: var(--text2); }
.grp span { opacity: .7; }
.empty { text-align: center; color: var(--text2); padding: var(--s6) var(--s2); font-size: 15px; line-height: 20px; }
.note { font-size: 15px; line-height: 20px; color: var(--text2); background: var(--raised); border-radius: var(--r1); padding: var(--s3) var(--s4); }
.ex-name { font-weight: 600; font-size: 17px; line-height: 22px; text-align: left; }
.sdot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }

/* ============ 6. Cards and lists ============ */
.card {
  position: relative; display: block; width: 100%; min-width: 0; color: inherit; text-align: left; padding: var(--s4);
  border-radius: var(--r2); background: var(--surface); border: 0; box-shadow: var(--shadow);
}
.card.row { display: flex; }
.card.tight { padding: var(--s3) var(--s4); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-bottom: var(--s3); min-height: 24px; }
/* Next up: a clean card; the split colour is only the small dot */
.card.nextup .card-h .eyebrow::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--split, var(--accent)); margin-right: 6px; vertical-align: 1px; }
.card.nextup .hero .sdot { display: none; }
.nextlist { margin-top: var(--s4); border-top: 1px solid var(--border); }
.nextlist .row { font-size: 15px; line-height: 20px; padding: 11px 0; border-bottom: 1px solid var(--border); gap: var(--s3); }
.nextlist .row:last-child { border-bottom: 0; padding-bottom: 0; }
.nextlist .row .num { color: var(--text2); white-space: nowrap; }
.nextlist .row .sec { color: var(--text); }
.nextlist > .cap { padding-top: var(--s3); }
/* KPI row: plain numbers split by hairlines, no boxes */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: var(--s4); border-top: 1px solid var(--border); padding-top: var(--s3); }
.kpi { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 0 var(--s3); border-left: 1px solid var(--border); }
.kpi:first-child { padding-left: 0; border-left: 0; }
.kpi b { font-variant-numeric: tabular-nums; font-size: 17px; line-height: 22px; font-weight: 600; }
.kpi span { font-size: 13px; line-height: 18px; color: var(--text2); }
.list { display: flex; flex-direction: column; }
.li { position: relative; display: flex; align-items: center; gap: var(--s3); padding: 11px 0; min-height: 52px; text-align: left; width: 100%; }
.li + .li::before { content: ""; position: absolute; left: 0; right: 0; top: 0; border-top: 1px solid var(--border); }
.li .t { font-size: 17px; line-height: 22px; font-weight: 400; }
.li .s { font-size: 13px; line-height: 18px; color: var(--text2); margin-top: 1px; }
.li:active { opacity: .6; }
.chev { color: var(--muted); flex: none; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.tbl td, .tbl th { padding: 10px 4px; border-bottom: 1px solid var(--border); text-align: left; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th { font-size: 13px; color: var(--text2); font-weight: 500; }
.tbl td.r, .tbl th.r { text-align: right; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--raised); color: var(--text2); white-space: nowrap; }
.pill.pr { background: color-mix(in srgb, var(--pr) 18%, transparent); color: color-mix(in srgb, var(--pr) 70%, var(--text)); }
.mus { display: flex; flex-wrap: wrap; gap: var(--s1); margin-top: var(--s2); }
.mus span { font-size: 12px; line-height: 16px; font-weight: 500; padding: 2px 8px; border-radius: 6px; background: var(--raised); color: var(--text2); }
.card[data-a]:active, .split:active { opacity: .75; }

/* ============ 7. Controls ============ */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 50px; padding: 0 var(--s5);
  border-radius: var(--r1); background: var(--raised); border: 0; font-size: 17px; font-weight: 600; color: var(--text);
  transition: opacity .15s;
}
.btn:active { opacity: .7; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { color: var(--neg); }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; padding: 0 var(--s3); font-size: 15px; border-radius: 8px; }
.btn:disabled { opacity: .35; }
.link { color: var(--accent); font-size: 15px; font-weight: 500; min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; }
.icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r1); color: var(--accent); flex: none; }
.icon-btn:active { opacity: .5; }
.icon-btn:disabled { opacity: .3; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 var(--s3); border-radius: 8px; border: 0; background: var(--raised); font-size: 15px; font-weight: 500; color: var(--text); white-space: nowrap; }
.chip:active { opacity: .6; }
.chip.on { color: var(--accent-ink); background: var(--accent); }
.chips { display: flex; gap: var(--s2); overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
/* iOS segmented control */
.seg { display: flex; background: var(--raised); border-radius: 9px; padding: 2px; gap: 0; }
.seg button { flex: 1; min-height: 32px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--text); position: relative; }
.seg button.on { background: var(--surface); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }
.field { display: flex; flex-direction: column; gap: 6px; }
.input { width: 100%; min-height: 44px; background: var(--raised); border: 0; border-radius: var(--r1); padding: 0 var(--s3); font-size: 17px; font-weight: 400; transition: box-shadow .15s; }
.input:focus { box-shadow: 0 0 0 2px var(--accent); outline: none; }
textarea.input { padding: var(--s3); min-height: 88px; resize: vertical; }
.input.sm { min-height: 40px; padding: 0 10px; font-size: 16px; } /* 16px stops iPhone zooming in on tap */
.daychip { min-height: 28px; padding: 0 2px; color: var(--accent); font-weight: 500; font-size: 15px; }
.datepick { position: relative; display: inline-flex; align-items: center; min-height: 28px; padding: 0 2px; color: var(--accent); font-size: 15px; font-weight: 500; cursor: pointer; }
.datepick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-appearance: none; appearance: none; }

/* ============ 8. Tab bar (standard iOS) ============ */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-width: 560px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: start;
  padding: 6px max(var(--s2), env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 4px);
  background: color-mix(in srgb, var(--surface) 88%, transparent); border-top: .5px solid var(--edge);
  -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
}
.tab, .tab-start { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; min-height: 44px; font-size: 10px; line-height: 12px; font-weight: 500; color: var(--muted); letter-spacing: .01em; }
.tab svg, .tab-start svg { width: 26px; height: 26px; }
.tab.on { color: var(--accent); }
.tab:active, .tab-start:active { opacity: .6; }
.tab-start { color: var(--accent); }
.tab-start.live { color: var(--green); }

/* ============ 9. Today ============ */
.ring { position: relative; width: 64px; height: 64px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring .c { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--text2); font-variant-numeric: tabular-nums; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--s1); text-align: center; }
.week .d { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--muted); }
.dot { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--border); background: transparent; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #fff; }
.dot.done { background: var(--text); border-color: transparent; }
.dot.miss { border-color: color-mix(in srgb, var(--neg) 60%, transparent); color: var(--neg); }
.dot.today { border: 2px solid var(--accent); }
.dot.future { opacity: .5; }
.dot.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--text); }

/* ============ 10. Charts ============ */
.chart { position: relative; width: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg line[stroke-dasharray] { stroke-dasharray: none; }
.chart svg path.draw { stroke-dasharray: 1; stroke-dashoffset: 0; }
#screen.enter .chart svg path.draw { animation: draw .7s .1s var(--ease) both; }
@keyframes draw { from { stroke-dashoffset: 1; } }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); font-weight: 500; }
.chart .tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--text); color: var(--bg); border-radius: 8px; padding: 4px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: var(--s4); font-size: 13px; color: var(--text2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); grid-auto-columns: minmax(6px, 1fr); gap: 3px; }
.heat i { aspect-ratio: 1; max-width: 100%; border-radius: 3px; background: var(--raised); display: block; }
.heat i.l1 { background: color-mix(in srgb, var(--accent) 28%, transparent); } .heat i.l2 { background: color-mix(in srgb, var(--accent) 52%, transparent); }
.heat i.l3 { background: color-mix(in srgb, var(--accent) 76%, transparent); } .heat i.l4 { background: var(--accent); }
.heat i.sk { background: transparent; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--neg) 60%, transparent); }
.heat i.out { visibility: hidden; }
.hbar { display: grid; grid-template-columns: 96px 1fr 32px; align-items: center; gap: var(--s2); font-size: 13px; }
.hbar .b { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; }
.hbar .b i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transform-origin: left; }
#screen.enter .hbar .b i { animation: grow .6s .1s var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } }

/* ============ 11. Splits and theme picker ============ */
.split { display: flex; align-items: center; gap: var(--s3); text-align: left; width: 100%; }
.split .tag { width: 4px; align-self: stretch; min-height: 44px; border-radius: 2px; flex: none; }
.split h3 { font-size: 17px; line-height: 22px; font-weight: 600; }
.spark { width: 64px; height: 26px; flex: none; }
.themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); margin: 2px 0 var(--s2); }
.theme-opt { display: flex; flex-direction: column; align-items: center; gap: var(--s2); padding: var(--s2); border-radius: var(--r1); border: 1.5px solid transparent; background: var(--raised); font-size: 13px; font-weight: 500; color: var(--text2); }
.theme-opt.on { border-color: var(--accent); color: var(--text); }
.theme-opt i { width: 100%; height: 44px; border-radius: 6px; display: block; }

/* ============ 12. Workout logger ============ */
#wk { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
#wk[hidden] { display: none !important; }
.wk-head {
  padding: calc(env(safe-area-inset-top, 0px) + var(--s2)) max(var(--s4), env(safe-area-inset-right, 0px)) var(--s3) max(var(--s4), env(safe-area-inset-left, 0px));
  border-bottom: .5px solid var(--edge); background: color-mix(in srgb, var(--surface) 90%, transparent); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
}
.wkname { font-size: 17px; line-height: 22px; font-weight: 600; }
.wk-body { flex: 1; overflow-y: auto; padding: var(--s4) max(var(--s4), env(safe-area-inset-right, 0px)) calc(130px + env(safe-area-inset-bottom, 0px)) max(var(--s4), env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: var(--s3); }
.race { height: 4px; border-radius: 2px; background: var(--raised); position: relative; margin-top: var(--s3); overflow: hidden; }
.race i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 2px; transition: width .5s var(--ease); }
.race i.ghost { background: var(--edge); }
.race i.me { background: var(--accent); }
.race i.me.ahead { background: var(--green); }
.sets { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: var(--s2); }
.sets th { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted); text-align: center; padding: 0 2px var(--s1); }
.sets th:nth-child(2) { text-align: left; }
.sets td { padding: 3px 2px; text-align: center; transition: background .25s; }
.sets tbody tr + tr td { border-top: 1px solid var(--border); }
.sets tr.done td { background: color-mix(in srgb, var(--green) 9%, transparent); }
.sets tr.done .cell { color: var(--text); }
.setno { width: 30px; height: 40px; border-radius: 8px; font-weight: 600; font-size: 15px; color: var(--text2); }
.setno.warm { color: var(--yellow); } .setno.drop { color: var(--blue); } .setno.fail { color: var(--neg); }
.prev { text-align: left !important; font-size: 13px; color: var(--muted); white-space: nowrap; }
.cell { width: 100%; min-width: 56px; height: 40px; border-radius: 8px; background: transparent; border: 0; font-size: 17px; font-weight: 600; color: var(--text2); font-variant-numeric: tabular-nums; }
.cell:active, .cell:focus { background: var(--raised); }
.cell.edited { color: var(--text); }
.check { width: 36px; height: 32px; border-radius: 8px; background: var(--raised); border: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.check svg { width: 18px; height: 18px; }
tr.done .check { background: var(--green); color: #fff; }
tr.pop .check { animation: pop .3s var(--ease); }
@keyframes pop { 0% { transform: scale(.85); } 100% { transform: none; } }
.cmp { display: flex; gap: var(--s3); flex-wrap: wrap; font-size: 13px; font-weight: 500; margin-top: var(--s2); }
.glow { animation: pop .3s var(--ease); }

/* ============ 13. Rest timer ============ */
.restpill { position: fixed; z-index: 45; left: 50%; transform: translateX(-50%); bottom: calc(var(--s5) + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: var(--s2); padding: 6px var(--s4) 6px var(--s2); border-radius: 999px; background: var(--text); color: var(--bg); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.restpill .t { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; line-height: 1; min-width: 64px; text-align: center; color: inherit; }
.restpill .bar { position: absolute; left: 22px; right: 22px; bottom: 4px; height: 2px; background: color-mix(in srgb, var(--bg) 20%, transparent); border-radius: 1px; overflow: hidden; }
.restpill .bar i { display: block; height: 100%; background: var(--accent); }
.restpill .icon-btn { width: 40px; height: 40px; font-size: 13px; font-weight: 600; color: inherit; }
.restpop { position: fixed; z-index: 45; left: var(--s3); right: var(--s3); max-width: 420px; margin: 0 auto; bottom: calc(var(--s3) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--s2); padding: var(--s4); border-radius: var(--r3); background: var(--surface); box-shadow: 0 12px 40px rgba(0,0,0,.2); animation: sheetUp .3s var(--ease); }
.restpop .hg { width: 56px; height: 84px; margin: 0 auto; }
.restpop .t { text-align: center; font-family: var(--font-display); font-size: 44px; line-height: 52px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.restpop.paused .t { opacity: .45; }
.hg svg, .hg-mini svg { width: 100%; height: 100%; overflow: visible; }
.hg-cap { fill: var(--text); }
.hg-glass { fill: var(--raised); stroke: var(--text); stroke-width: 2; stroke-linejoin: round; }
.hg-sand { fill: var(--accent); transition: y .9s linear, height .9s linear; }
.hg-stream { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 3 5; animation: stream .5s linear infinite; }
@keyframes stream { to { stroke-dashoffset: -8; } }
.hg-mini { width: 18px; height: 28px; display: block; }
.restpill .hg-cap { fill: var(--bg); } .restpill .hg-glass { stroke: var(--bg); fill: transparent; }
#wk:has(.restpop) .wk-body { padding-bottom: calc(330px + env(safe-area-inset-bottom, 0px)); }

/* ============ 14. Set feedback (calm) ============ */
.cele { position: fixed; z-index: 85; left: 50%; top: 40%; transform: translate(-50%, -50%); width: min(280px, calc(100% - 48px)); display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center;
  padding: var(--s5) var(--s4); border-radius: var(--r3); background: var(--surface); box-shadow: 0 16px 48px rgba(0,0,0,.22); border-top: 3px solid var(--accent);
  animation: celeIn .25s var(--ease) both, celeOut .25s ease-in 1.6s forwards; }
.cele b { font-family: var(--font-display); font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -.015em; }
.cele span { font-size: 15px; line-height: 20px; color: var(--text2); }
.cele-low { border-top-color: var(--blue); }
.cele-nice { border-top-color: var(--green); }
.cele-great { border-top-color: var(--yellow); }
.cele-amazing { border-top-color: var(--accent); }
.cele-next { border-top-color: var(--green); }
@keyframes celeIn { from { transform: translate(-50%, -46%) scale(.96); opacity: 0; } }
@keyframes celeOut { to { transform: translate(-50%, -54%); opacity: 0; } }
.confetti { position: fixed; inset: 0; z-index: 90; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 6px; height: 10px; border-radius: 1px; animation: fall var(--d, 1.4s) cubic-bezier(.25, .6, .4, 1) forwards; }
@keyframes fall { to { transform: translate(var(--x), 105vh) rotate(var(--r)); } }

/* ============ 15. Sheets, keypad, toast ============ */
#sheets { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.32); pointer-events: auto; animation: fade .25s ease; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 92%; overflow-y: auto; pointer-events: auto;
  background: var(--surface); border-radius: var(--r3) var(--r3) 0 0; box-shadow: 0 -8px 40px rgba(0,0,0,.18);
  padding: var(--s2) max(var(--s4), env(safe-area-inset-right, 0px)) calc(var(--s4) + env(safe-area-inset-bottom, 0px)) max(var(--s4), env(safe-area-inset-left, 0px));
  animation: sheetUp .32s var(--ease);
}
.sheet .card { background: var(--raised); box-shadow: none; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--edge); margin: 0 auto var(--s3); }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); }
.keys button { min-height: 52px; border-radius: var(--r1); background: var(--raised); font-size: 24px; font-weight: 400; font-variant-numeric: tabular-nums; }
.keys button:active { opacity: .55; }
.keys button.q { font-size: 15px; font-weight: 500; color: var(--text2); }
.keys button.done { background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 600; }
.ruler { position: relative; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; height: 64px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); }
.ruler::-webkit-scrollbar { display: none; }
.ruler-in { display: flex; align-items: flex-end; height: 100%; }
.ruler-in i { flex: none; width: var(--tw, 12px); height: 16px; scroll-snap-align: center; position: relative; }
.ruler-in i::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 1.5px; height: 100%; background: var(--muted); }
.ruler-in i.m::after { height: 28px; background: var(--text2); }
.ruler-in i.m b { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); font-weight: 500; }
.ruler-mark { position: absolute; left: 50%; top: 20px; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--accent); border-radius: 2px; pointer-events: none; }
.toast { position: fixed; z-index: 80; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + var(--s3)); background: var(--text); color: var(--bg); font-weight: 500; border-radius: var(--r2); padding: var(--s3) var(--s4); font-size: 15px; line-height: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.2); max-width: calc(100% - 32px); animation: toastIn .25s var(--ease); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -12px); } }
.splash { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s3); color: var(--text2); }
.assume { display: flex; flex-direction: column; gap: var(--s3); font-size: 15px; color: var(--text2); }
.assume li { margin-left: -6px; }
.skel { position: relative; z-index: 1; padding: calc(var(--s4) + env(safe-area-inset-top, 0px)) var(--s4) 0; display: flex; flex-direction: column; gap: var(--s4); max-width: 560px; margin: 0 auto; }
.skel i { display: block; border-radius: var(--r2); background: linear-gradient(90deg, var(--raised) 0%, color-mix(in srgb, var(--text) 10%, transparent) 50%, var(--raised) 100%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
.skel hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

/* ============ 16. Recap ============ */
#recap { position: fixed; inset: 0; z-index: 70; overflow-y: auto; background: var(--bg); opacity: 0; transform: translateY(20px); transition: opacity .25s, transform .3s var(--ease); }
#recap.in { opacity: 1; transform: none; }
.rc-body { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s4); padding: calc(var(--s6) + env(safe-area-inset-top, 0px)) var(--s4) calc(var(--s6) + env(safe-area-inset-bottom, 0px)); }
.rc-hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--s1); padding: var(--s2) 0; }
.rc-hero h1 { font-size: 34px; }
.rc-check { width: 64px; height: 64px; margin-bottom: var(--s2); }
.rc-check svg { width: 100%; height: 100%; }
.rc-check circle { fill: var(--accent); }
.rc-check path { fill: none; stroke: var(--accent-ink, #fff); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: drawOn .4s .2s ease-out forwards; }
@keyframes drawOn { to { stroke-dashoffset: 0; } }
.rc-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border-radius: var(--r2); overflow: hidden; box-shadow: var(--shadow); }
.rc-st { display: flex; flex-direction: column; gap: 2px; padding: var(--s3); background: var(--surface); }
.rc-st b { font-size: 17px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rc-st span { font-size: 12px; line-height: 16px; color: var(--text2); }
.rc-fun { display: flex; align-items: center; gap: var(--s3); }
.rc-emoji { color: var(--accent); display: flex; }
.rc-pr { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) 0; border-top: 1px solid var(--border); }
.rc-pr:first-of-type { border-top: 0; }
.rc-pr .t { font-weight: 600; }
.rc-medal { display: flex; color: var(--pr); }
.rc-mu { display: grid; grid-template-columns: 96px 1fr 58px; align-items: center; gap: var(--s3); padding: 5px 0; font-size: 15px; }
.rc-mu i { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; }
.rc-mu i b { display: block; height: 100%; border-radius: 4px; background: var(--accent); transform-origin: left; animation: grow .6s .2s var(--ease) both; }
.rc-mu em { font-style: normal; font-size: 13px; color: var(--text2); text-align: right; }

/* ============ 17. Plate loader ============ */
.bar-wrap { border-radius: var(--r2); background: var(--raised); padding: var(--s2) var(--s1); transition: box-shadow .2s; }
.bar-wrap.hot { box-shadow: 0 0 0 2px var(--accent); }
.barsvg { width: 100%; height: auto; display: block; overflow: visible; }
.barsvg .pl { cursor: pointer; transform-box: fill-box; }
.barsvg .pl.R.new { animation: slideR .4s var(--ease) both; }
.barsvg .pl.L.new { animation: slideL .4s var(--ease) both; }
@keyframes slideR { from { transform: translateX(80px); opacity: 0; } }
@keyframes slideL { from { transform: translateX(-80px); opacity: 0; } }
.plate-tray { display: flex; gap: var(--s2); overflow-x: auto; padding: var(--s2) 2px var(--s1); align-items: flex-end; scrollbar-width: none; touch-action: pan-x; }
.plate-tray::-webkit-scrollbar { display: none; }
.plate-chip { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 48px; padding: 6px var(--s1); border-radius: var(--r1); touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.plate-chip:active { background: var(--raised); }
.plate-chip i { width: 16px; height: var(--ph); border-radius: 4px; background: var(--pc); box-shadow: inset 2px 0 0 rgba(255,255,255,.2); }
.plate-chip b { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.plate-ghost { position: fixed; left: 0; top: 0; z-index: 200; pointer-events: none; width: 22px; height: var(--ph); margin: calc(var(--ph) / -2) 0 0 -11px; border-radius: 5px; background: var(--pc); box-shadow: 0 10px 24px rgba(0,0,0,.3); }

/* ============ 18. Themes ============ */
/* Each theme sets tokens, the band background (--band) and the band artwork (--band-art).
   Artwork is flat silhouettes in low contrast: atmosphere, not illustration. */

/* Climbing (default): chalk wall, a few muted holds, a rope */
:root:not([data-theme]) {
  --band: linear-gradient(180deg, #E4DED5 0%, #EAE5DE 70%, var(--bg) 100%);
  --band-art: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 236'%3E%3Cg fill='%23D3CABE'%3E%3Cpath d='M300 40l22-8 14 10-6 16-20 4-12-10z'/%3E%3Cpath d='M352 96l18-4 10 14-10 12-16-4z'/%3E%3Cpath d='M262 112l14-10 16 6-2 16-16 4z'/%3E%3Cpath d='M330 160l20-6 12 12-8 14-20-2z'/%3E%3Cpath d='M228 60l12-6 10 8-4 12-12 2z'/%3E%3C/g%3E%3Cpath d='M384 0C352 70 300 130 362 236' fill='none' stroke='%23BDB2DE' stroke-width='3'/%3E%3C/svg%3E");
}

:root[data-theme="cliffs"] {

  --accent: #1E6F8C; --accent-dark: #14526A; --blue: #1E6F8C;

  --band-art: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 236'%3E%3Cpath d='M0 150L46 118L84 136L136 90L190 132L236 104L282 128L330 92L400 126V236H0Z' fill='%23ffffff' fill-opacity='.22'/%3E%3Cpath d='M0 182L58 158L112 176L170 146L232 172L292 150L350 168L400 156V236H0Z' fill='%23264E6E' fill-opacity='.35'/%3E%3C/svg%3E");
}
:root[data-theme="cliffs"] .top h1 { text-shadow: 0 1px 12px rgba(0,0,0,.12); }
:root[data-theme="cliffs"][data-tod="night"] {

}
:root[data-theme="cliffs"] #bg .sky-stars { display: block; }

:root[data-theme="mono"] {

  --bg: #08080A; --surface: #141418; --surface-solid: #141418; --raised: rgba(160,160,175,.15);
  --border: rgba(255,255,255,.08); --edge: rgba(255,255,255,.16);

  --shadow: 0 0 0 .5px rgba(255,255,255,.07);

}
:root[data-theme="mono"] #bg .land { background-position: center top; }
:root[data-theme="mono"] .split .tag, :root[data-theme="mono"] .sdot, :root[data-theme="mono"] .dot.done[style], :root[data-theme="mono"] .spark, :root[data-theme="mono"] .card.nextup .card-h .eyebrow::before { filter: grayscale(1) brightness(1.4); }

/* Spider: night city in navy, hero red accent, faint web lines (no logos) */
:root[data-theme="spidey"] {
  color-scheme: dark;
  --bg: #0A1230; --surface: #131D45; --surface-solid: #131D45; --raised: rgba(150,170,230,.14);
  --border: rgba(255,255,255,.08); --edge: rgba(255,255,255,.16);

}

/* ============ 19. Utilities (replace static inline styles) ============ */
.m0 { margin: 0 !important; }
.mt0 { margin-top: 0 !important; } .mt1 { margin-top: var(--s1) !important; } .mt2 { margin-top: var(--s2) !important; } .mt3 { margin-top: var(--s3) !important; } .mt4 { margin-top: var(--s4) !important; } .mt5 { margin-top: var(--s5) !important; } .mt6 { margin-top: var(--s6) !important; }
.mb1 { margin-bottom: var(--s1) !important; } .mb2 { margin-bottom: var(--s2) !important; } .mb3 { margin-bottom: var(--s3) !important; }
.pt0 { padding-top: 0 !important; } .pt3 { padding-top: var(--s3) !important; } .pt6 { padding-top: var(--s6) !important; }
.pb8 { padding-bottom: var(--s8) !important; }
.g1 { gap: var(--s1) !important; } .g2 { gap: var(--s2) !important; } .g3 { gap: var(--s3) !important; } .g4 { gap: var(--s4) !important; }
.tl { text-align: left !important; } .tc { text-align: center !important; } .tr { text-align: right !important; }
.f13 { font-size: 13px !important; line-height: 18px; } .f15 { font-size: 15px !important; line-height: 20px; } .f17 { font-size: 17px !important; line-height: 22px; } .f22 { font-size: 22px !important; line-height: 28px; } .f28 { font-size: 28px !important; line-height: 34px; }
.fw6 { font-weight: 600 !important; } .fw7 { font-weight: 700 !important; } .it { font-style: italic; }
.c-text { color: var(--text) !important; } .c-neg { color: var(--neg) !important; } .c-acc { color: var(--accent) !important; }
.rel { position: relative; } .flex1 { flex: 1; } .self-c { align-self: center; } .span2 { grid-column: span 2; } .full { width: 100%; }
.sr { position: absolute !important; left: -9999px; }
.mh0 { min-height: 0 !important; } .mh28 { min-height: 28px !important; } .mh32 { min-height: 32px !important; } .mh44 { min-height: 44px !important; } .mh52 { min-height: 52px !important; }
.dim { opacity: .3; }

@media (max-width: 360px) { .big { font-size: 28px; line-height: 34px; } .hero { font-size: 24px; } h1 { font-size: 28px; line-height: 34px; } .rc-stats { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .confetti { display: none; } .rc-check path { stroke-dashoffset: 0; } }

/* Follow-ups from the first screenshots */
.kpis:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
.btn.ghost.sec { color: var(--text2); }

/* ============ Climbing comes back to life (Job, 15 Oct: "took away all the fun and color") ============
   The full chalk wall with bright holds returns behind everything, the Next up card is painted in its
   split colour again, and week dots and split tags are rock-shaped holds. Cards stay solid so data reads cleanly. */
:root:not([data-theme]) {
  --bg: #EFEBE5; --accent: #6C3FD6; --accent-dark: #4B27A8; --violet: #6C3FD6;
  --yellow: #F4B728; --green: #2E8B4E; --red: #E0412F; --blue: #4A78E0; --pos: #2E8B4E; --neg: #E0412F; --pr: #F4B728;
  --band: none; --band-art: none;
}
:root:not([data-theme]) #bg::after { display: none; }
:root:not([data-theme]) .top { text-shadow: 0 1px 0 rgba(255,255,255,.6); }
:root:not([data-theme]) .card.nextup { background: var(--split, var(--accent)); color: var(--ink, #fff); overflow: hidden; box-shadow: 0 10px 30px -14px rgba(0,0,0,.45); }
:root:not([data-theme]) .card.nextup::before { content: ""; position: absolute; pointer-events: none; }
:root:not([data-theme]) .card.nextup > * { position: relative; }
:root:not([data-theme]) .card.nextup .eyebrow, :root:not([data-theme]) .card.nextup .cap, :root:not([data-theme]) .card.nextup .sec, :root:not([data-theme]) .card.nextup .muted, :root:not([data-theme]) .card.nextup .nextlist .row .num { color: inherit !important; opacity: .78; }
:root:not([data-theme]) .card.nextup .nextlist .row .sec { opacity: 1; }
:root:not([data-theme]) .card.nextup .card-h .eyebrow::before { display: none; }
:root:not([data-theme]) .card.nextup .nextlist, :root:not([data-theme]) .card.nextup .nextlist .row { border-color: color-mix(in srgb, currentColor 20%, transparent); }
:root:not([data-theme]) .card.nextup .btn.primary { background: var(--ink, #fff); color: var(--split, var(--accent)); }
:root:not([data-theme]) .card.nextup .btn:not(.primary) { background: color-mix(in srgb, currentColor 16%, transparent); color: inherit; }
:root:not([data-theme]) .split .tag { align-self: center; min-height: 0; }
:root:not([data-theme]) .dot.sel { box-shadow: none; outline: 2.5px solid var(--text); outline-offset: 3px; }
:root:not([data-theme]) .split .tag, :root:not([data-theme]) .sdot, :root:not([data-theme]) .dot { border-radius: 0; clip-path: polygon(12% 18%, 48% 2%, 86% 10%, 100% 46%, 88% 84%, 52% 100%, 14% 90%, 0% 52%); }
:root:not([data-theme]) .split .tag { width: 34px; height: 28px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2), inset 3px 3px 0 rgba(255,255,255,.25); }
:root:not([data-theme]) .split:nth-child(4n+2) .tag, :root:not([data-theme]) .week .d:nth-child(4n+2) .dot { clip-path: polygon(20% 4%, 70% 0%, 98% 30%, 92% 72%, 64% 98%, 22% 94%, 2% 64%, 4% 26%); }
:root:not([data-theme]) .split:nth-child(4n+3) .tag, :root:not([data-theme]) .week .d:nth-child(4n+3) .dot { clip-path: polygon(6% 30%, 34% 4%, 78% 6%, 100% 38%, 96% 70%, 70% 96%, 30% 100%, 0% 70%); }
:root:not([data-theme]) .split:nth-child(4n) .tag, :root:not([data-theme]) .week .d:nth-child(4n) .dot { clip-path: polygon(16% 10%, 58% 0%, 94% 18%, 100% 60%, 80% 94%, 40% 100%, 6% 80%, 0% 40%); }
:root:not([data-theme]) .sdot { width: 16px; height: 14px; clip-path: polygon(16% 10%, 58% 0%, 94% 18%, 100% 60%, 80% 94%, 40% 100%, 6% 80%, 0% 40%); }
:root:not([data-theme]) .dot { width: 36px; height: 34px; border: 0; background: var(--raised); box-shadow: inset 0 -4px 0 rgba(0,0,0,.1); }
:root:not([data-theme]) .dot.done { box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), inset 3px 3px 0 rgba(255,255,255,.22); }
:root:not([data-theme]) .dot.today { background: color-mix(in srgb, var(--accent) 24%, var(--raised)); color: var(--accent); }
:root:not([data-theme]) .dot.miss { background: color-mix(in srgb, var(--neg) 20%, var(--raised)); }

/* ============ Settings groups (Oct 2026): iOS inset grouped lists ============ */
.card.stack { display: flex; flex-direction: column; gap: var(--s3); }
.sgh { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text2); margin: 0 0 var(--s2) var(--s4); text-transform: none; }
.sgf { font-size: 13px; line-height: 18px; color: var(--text2); margin: var(--s2) var(--s4) 0; }
.sgrp { background: var(--surface); border-radius: var(--r2); box-shadow: var(--shadow); padding: 0 var(--s4); }
.sgrp.pad { padding: var(--s4); }
.xr { position: relative; display: flex; align-items: center; gap: var(--s3); min-height: 50px; padding: 10px 0; width: 100%; text-align: left; font-size: 17px; line-height: 22px; color: var(--text); background: none; border: 0; cursor: pointer; }
.sgrp > .xr:not(:first-child)::before, .sgrp > .xr-d:not(:first-child) > .xr::before { content: ""; position: absolute; left: 0; right: 0; top: 0; border-top: 1px solid var(--border); }
.xr .grow { min-width: 0; }
.xr .s { display: block; font-size: 13px; line-height: 18px; color: var(--text2); margin-top: 1px; }
.xr.act { color: var(--accent); }
.xr.neg { color: var(--neg); }
.xr svg { color: var(--muted); flex: none; }
button.xr:active, label.xr[for]:active { opacity: .6; }
.xr-in { width: 120px; flex: none; text-align: right; background: transparent; border: 0; padding: 0; font-size: 17px; line-height: 22px; color: var(--text2); min-height: 30px; }
.xr-in:focus { outline: none; color: var(--text); }
.xr-in::placeholder { color: var(--muted); }
.xr-u { color: var(--text2); font-size: 17px; margin-left: -6px; }
.xr-v { color: var(--text2); max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xr-p { margin: 0; padding: var(--s3) 0; font-size: 15px; line-height: 20px; color: var(--text2); }
.xr-d > summary { list-style: none; }
.xr-d > summary::-webkit-details-marker { display: none; }
.xr-ol { padding: 0 0 var(--s3) 20px; display: flex; flex-direction: column; gap: var(--s2); }
.w140 { width: 140px; flex: none; }
.xsw { position: relative; width: 51px; height: 31px; flex: none; border-radius: 16px; border: 0; padding: 0; background: var(--raised); box-shadow: inset 0 0 0 1px var(--border); transition: background .2s; cursor: pointer; }
.xsw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .2s var(--ease); }
.xsw.on { background: var(--pos); box-shadow: none; }
.xsw.on::after { transform: translateX(20px); }

/* ============ Recap v2 (Oct 2026) ============ */
#recap .rc-body { padding-top: 0; }
.rc-hero { margin: 0 calc(-1 * var(--s4)); padding: calc(var(--s8) + env(safe-area-inset-top, 0px)) var(--s4) var(--s6); border-radius: 0 0 var(--r3) var(--r3); background: linear-gradient(160deg, var(--split), color-mix(in srgb, var(--split) 70%, #000)); color: var(--ink, #fff); }
.rc-hero h1 { color: inherit; font-size: 40px; line-height: 46px; letter-spacing: -.02em; }
.rc-hero .rc-check circle { fill: color-mix(in srgb, var(--ink, #fff) 22%, transparent); }
.rc-hero .rc-check path { stroke: var(--ink, #fff); }
.rc-date { font-size: 15px; line-height: 20px; font-weight: 500; opacity: .85; }
.rc-tags { display: flex; gap: var(--s2); justify-content: center; margin-top: var(--s2); }
.rc-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, var(--ink, #fff) 18%, transparent); }
.rc-tag .sdot { width: 8px; height: 8px; background: var(--ink, #fff); }
.rc-tag.pr { background: var(--pr); color: #221E2B; }
.rc-big { font-size: 44px; line-height: 50px; font-weight: 700; letter-spacing: -.02em; margin-top: var(--s1); }
.rc-big .unit { font-size: 20px; }
.rc-cmp { margin-top: var(--s4); padding-top: var(--s3); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: var(--s2); }
.rc-bar { display: grid; grid-template-columns: 92px 1fr 56px; align-items: center; gap: var(--s3); font-size: 13px; color: var(--text2); }
.rc-bar i { height: 10px; border-radius: 5px; background: var(--raised); overflow: hidden; }
.rc-bar i b { display: block; height: 100%; border-radius: 5px; background: var(--split); animation: grow .6s .2s var(--ease) both; transform-origin: left; }
.rc-bar.was i b { background: var(--muted); }
.rc-bar em { font-style: normal; text-align: right; color: var(--text); font-weight: 600; }
.c-pos { color: var(--pos); }
.rc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
.rc-dl { font-size: 12px; line-height: 16px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--raised); color: var(--text2); white-space: nowrap; }
.rc-dl.up { color: var(--pos); background: color-mix(in srgb, var(--pos) 14%, transparent); }
.rc-dl.dn { color: var(--neg); background: color-mix(in srgb, var(--neg) 12%, transparent); }
.rc-dl.new { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.rc-mu i b { background: var(--split); }
.rc-week { display: flex; flex-direction: column; gap: var(--s3); }
.rc-dots { display: flex; gap: var(--s2); }
.rc-dots i { flex: 1; height: 8px; border-radius: 4px; background: var(--raised); }
.rc-dots i.on { background: var(--split); }

/* iOS date inputs ignore width and spill into the next box; make them behave like normal fields */
input[type=date].input { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; text-align: left; line-height: 44px; }
input[type=date].input::-webkit-date-and-time-value { text-align: left; margin: 0; }
.field { min-width: 0; }
.grid2 > * { min-width: 0; }
.kpis.rc-k { display: grid; grid-template-columns: repeat(4, 1fr); }
.kpis.rc-k .kpi { padding: 0 var(--s2); } .kpis.rc-k .kpi:first-child { padding-left: 0; }

/* ============ Targets and machine setup (Oct 2026) ============ */
.tgt-line { margin-top: var(--s1); font-size: 13px; line-height: 18px; font-weight: 600; color: var(--accent); }
.sets .cell.tgt { color: var(--accent); font-weight: 600; }
.setup { display: flex; align-items: center; gap: 6px; margin-top: var(--s2); padding: 6px 10px; border-radius: 8px; background: var(--raised); color: var(--text); font-size: 13px; line-height: 18px; text-align: left; max-width: 100%; border: 0; cursor: pointer; }
.setup svg { flex: none; color: var(--text2); }
.setup span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.setup.empty { background: transparent; color: var(--text2); padding-left: 0; }
.stack > .setup { margin-top: 0; align-self: flex-start; background: var(--surface); box-shadow: var(--shadow); padding: 10px 14px; font-size: 15px; }

/* ============ Swap, plateaus, reports, badges, measurements (Oct 2026) ============ */
.cbox { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.pl-line { margin-top: var(--s1); font-size: 13px; line-height: 18px; color: var(--yellow); font-weight: 600; }
.rc-ready { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 65%, #000)); color: var(--accent-ink); }
.rc-ready .eyebrow { color: inherit; opacity: .8; }
.rc-ready svg { color: inherit; }
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s3) var(--s2); }
.badge { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; min-width: 0; }
.bd-ic { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--muted) calc(var(--p) * 360deg), var(--raised) 0); padding: 4px; }
.bd-ic span { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--text2); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.badge.on .bd-ic { background: linear-gradient(145deg, #FFD86B, #E0A526 60%, #B8801A); box-shadow: 0 2px 8px rgba(224, 165, 38, .35); }
.badge.on .bd-ic span { background: linear-gradient(145deg, #F7C948, #E0A526); color: #3A2A06; box-shadow: inset 0 0 0 2px rgba(255, 236, 170, .7); }
.bd-t { font-size: 12px; line-height: 15px; font-weight: 600; }
.bd-s { font-size: 11px; line-height: 14px; color: var(--text2); }
.badge:not(.on) .bd-t { color: var(--text2); }
.ph-cmp { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); margin-bottom: var(--s3); }
.ph-cmp figure { margin: 0; }
.ph-cmp img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: var(--r1); display: block; }
.ph-cmp figcaption { font-size: 12px; color: var(--text2); margin-top: 4px; }
.ph-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
.ph { padding: 0; border: 0; background: none; text-align: left; }
.ph img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; display: block; }
.ph span { font-size: 11px; color: var(--text2); }

/* ============ Add to Home Screen guide ============ */
.a2-hero { display: flex; align-items: center; gap: var(--s4); }
.a2-hero img { border-radius: 14px; flex: none; box-shadow: var(--shadow); }
.a2-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--raised); border-radius: var(--r2); }
.a2-steps li { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); font-size: 15px; line-height: 20px; }
.a2-steps li + li { border-top: 1px solid var(--border); }
.a2-n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
.a2-ic { color: var(--blue); flex: none; }

/* ============ Launch: legal links, honeypot, danger button ============ */
.hp { position: absolute !important; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.si-age { align-items: flex-start; line-height: 18px; }
.si-age a, .legal a { color: var(--accent); }
.btn.danger-fill { background: var(--neg); color: #fff; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
a.xr { text-decoration: none; }
.tmpl { display: grid; gap: var(--s2); }
.tmpl button { text-align: left; padding: var(--s3) var(--s4); border-radius: var(--r2); background: var(--surface); box-shadow: var(--shadow); border: 2px solid transparent; }
.tmpl button.on { border-color: var(--accent); }
.tmpl b { display: block; font-size: 17px; }
.tmpl span { font-size: 13px; color: var(--text2); }

/* ============ Review fixes (15 Oct) ============ */

.est-note b { font-size: 15px; } .est-note span { font-size: 13px; line-height: 18px; color: var(--text2); }
.est-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .02em; padding: 1px 7px; border-radius: 999px; border: 1px dashed currentColor; color: color-mix(in srgb, var(--yellow, #F4B728) 55%, var(--text)); }
/* One destructive style in every theme: red outline and red text. Primary buttons are filled, so even Spider's red primary reads differently. */

.xr.danger { color: var(--danger); }
.xr.acc { color: var(--accent); }
.rc-line { font-size: 17px; line-height: 22px; font-weight: 600; margin-top: 2px; opacity: .92; }

/* Workout logger: the theme's scenery sits behind the cards too (Job, 15 Oct). Cards stay solid so numbers read cleanly. */
#wk { background: var(--bg); }
:root[data-theme="cliffs"] #wk, :root[data-theme="spidey"] #wk { background: var(--band-art) center bottom / 100% auto no-repeat, var(--band), var(--bg); }
:root[data-theme="mono"] #wk { background: var(--band-art) center 0 / 100% auto no-repeat, var(--band), var(--bg); }
:root:not([data-theme]) #wk { background: linear-gradient(rgba(239,235,229,.4), rgba(239,235,229,.4)), var(--wall), var(--bg); }
.wk-head { background: color-mix(in srgb, var(--surface) 78%, transparent); }
#wk .wk-body > .btn:not(.primary), #wk .wk-body > button:not(.primary) { background: var(--surface-solid, var(--surface)); box-shadow: var(--shadow); }
:root[data-theme="mono"] #wk { background-position: center 0, 0 0, 0 0; }
#wk .wk-body > .link { padding: 8px 18px; border-radius: 999px; }
.dwrap { position: relative; display: block; }
.dwrap > input[type=date] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; z-index: 1; }
.dwrap > .dtext { display: flex; align-items: center; pointer-events: none; }
/* Readability (review, 15 Oct) */
#tabs { background: var(--surface-solid, var(--surface)); -webkit-backdrop-filter: none; backdrop-filter: none; }

.top .btn.sm { background: var(--surface-solid, var(--surface)); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); -webkit-backdrop-filter: none; backdrop-filter: none; }
.xr-in::placeholder, .input::placeholder, textarea::placeholder { color: var(--muted); font-style: italic; opacity: .8; }
.plate-tray { padding-right: 24px; scroll-padding-right: 24px; }
#wk .back { color: var(--accent); background: var(--surface-solid, var(--surface)); border-radius: 999px; padding: 6px 12px 6px 8px; box-shadow: var(--shadow); align-self: flex-start; }
:root[data-theme="cliffs"] { --hdr-ink2: rgba(255,255,255,.96); }
:root[data-theme="cliffs"] .top .eyebrow, :root[data-theme="cliffs"] .top .cap, :root[data-theme="cliffs"] .top p, :root[data-theme="cliffs"] .top .back, :root[data-theme="cliffs"] .top > div > div:not(.btn) { text-shadow: 0 1px 6px rgba(20,40,70,.45); }
.info { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-left: 4px; border-radius: 50%; font: 700 11px/1 var(--font-display, inherit); font-style: italic; color: var(--text2); background: color-mix(in srgb, var(--text) 10%, transparent); vertical-align: 1px; text-transform: none; letter-spacing: 0; position: relative; }
.info::after { content: ""; position: absolute; inset: -12px; }
.card.nextup .info { color: inherit; background: color-mix(in srgb, currentColor 18%, transparent); }
.gl { display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; }
.gl-i { padding: 12px 14px; border-radius: 14px; background: var(--raised); }
.gl-i.on { box-shadow: inset 0 0 0 2px var(--accent); }
.gl-i b { font-size: 16px; } .gl-i p { margin: 4px 0 0; font-size: 14px; line-height: 20px; color: var(--text2); }
/* Today: folding exercise lists, compact steps row (15 Oct) */
.fold { margin-top: var(--s4); }
.fold-s { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border-radius: 12px; font-size: 15px; font-weight: 600; color: var(--accent); background: color-mix(in srgb, currentColor 8%, transparent); cursor: pointer; }
.fold-s svg { transition: transform .2s ease; }

.steps-row { align-items: center; }
.ring.sm { width: 64px; height: 64px; flex: none; } .ring.sm .c { font-size: 13px; }
.rest-end { margin-top: -4px; font-variant-numeric: tabular-nums; }
.restpill .rp-end { font-size: 13px; opacity: .7; font-variant-numeric: tabular-nums; }
.restpill .rp-end:empty { display: none; }
/* Left + right of one lift read as one card (15 Oct) */
#wk .card.uni-l { border-bottom-left-radius: 0; border-bottom-right-radius: 0; margin-bottom: 0; padding-bottom: var(--s3); }
#wk .card.uni-r { border-top-left-radius: 0; border-top-right-radius: 0; margin-top: calc(-1 * var(--s3) - 1px); border-top: 1px dashed var(--border); padding-top: var(--s3); box-shadow: none; }
.uni-lbl { display: inline-block; margin-top: var(--s2); padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.uni-r .setup, .uni-r .pl-line { display: none; }
/* Hitman (replaced Symbiote, 15 Oct): black suit, white shirt, one red tie. Red only for PRs and the tie. */
:root[data-theme="mono"] .pill.pr { color: #fff; background: #B0101F; }
:root[data-theme="mono"] .top h1, :root[data-theme="mono"] .top .eyebrow { text-shadow: 0 2px 14px rgba(0,0,0,.75); }
/* ============ First sign-in intro (15 Oct) ============ */
.ob { display: flex; flex-direction: column; min-height: 100%; padding: calc(env(safe-area-inset-top, 0px) + var(--s3)) var(--s4) calc(env(safe-area-inset-bottom, 0px) + var(--s4)); max-width: 520px; margin: 0 auto; }
.ob-top { display: flex; align-items: center; gap: var(--s3); position: relative; z-index: 2; }
.ob-top .hide { visibility: hidden; }
.ob-prog { flex: 1; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--hdr-ink, var(--text)) 18%, transparent); overflow: hidden; }
.ob-prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .35s ease; }
.ob-top .cap { color: var(--hdr-ink2, var(--text2)); }
.ob-body { flex: 1; padding-top: var(--s5); position: relative; z-index: 1; }
.ob-t { margin: 0; color: var(--hdr-ink, var(--text)); }
.ob-s { margin: calc(-1 * var(--s2)) 0 0; color: var(--hdr-ink2, var(--text2)); }
.ob-body[data-k="you"] .ob-s, .ob-body[data-k="goal"] .ob-s, .ob-body[data-k="exp"] .ob-s, .ob-body[data-k="theme"] .ob-s, .ob-body[data-k="plan"] .ob-s { margin-bottom: var(--s5); }
.ob-hero { display: flex; flex-direction: column; gap: var(--s3); }
.ob-hero img { border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.ob-hero h1 { margin: 0; color: var(--hdr-ink, var(--text)); }
.ob-hero p { margin: 0; color: var(--hdr-ink2, var(--text2)); }
.note.ok { border-left: 3px solid var(--pos); }
.ob-foot { position: sticky; bottom: 0; padding-top: var(--s4); display: flex; flex-direction: column; gap: var(--s2); background: linear-gradient(180deg, transparent, var(--bg) 30%); z-index: 2; }
.ob-err { color: var(--danger, #C9302C); min-height: 18px; text-align: center; }
.ob-rec { font-style: normal; font-size: 12px; font-weight: 700; color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: 2px; }
.ob .tmpl button b { display: block; font-size: 17px; } .ob .tmpl button span { display: block; font-size: 14px; color: var(--text2); margin-top: 2px; }
.ob-themes { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.ob-themes button { text-align: left; padding: var(--s3); border-radius: var(--r3, 20px); background: var(--surface); box-shadow: var(--shadow); border: 2px solid transparent; display: flex; flex-direction: column; gap: 4px; }
.ob-themes button.on { border-color: var(--accent); }
.ob-themes i { display: block; height: 96px; border-radius: 14px; margin-bottom: 6px; }
.ob-themes b { font-size: 17px; } .ob-themes span { font-size: 13px; color: var(--text2); }
/* feature tour: swipe sideways */
.ob-tour { display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; margin: 0 calc(-1 * var(--s4)); padding: var(--s2) 0; scrollbar-width: none; overscroll-behavior-x: contain; }
.ob-tour::-webkit-scrollbar { display: none; }
.ob-slide { flex: 0 0 100%; min-width: 0; box-sizing: border-box; padding: 0 var(--s4); scroll-snap-align: start; display: flex; flex-direction: column; gap: var(--s2); }
.ob-slide h2 { margin: var(--s3) 0 0; color: var(--text); }
.ob-slide p { margin: 0; font-size: 16px; line-height: 22px; }
.ob-dots { display: flex; justify-content: center; gap: 8px; padding-top: var(--s3); }
.ob-dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--muted); transition: width .25s ease, background .25s; }
.ob-dots i.on { width: 22px; background: var(--accent); }
.ob-mock { background: var(--surface-solid, var(--surface)); border-radius: 22px; box-shadow: var(--shadow), 0 14px 40px -18px rgba(0,0,0,.35); padding: var(--s4); min-height: 236px; display: flex; flex-direction: column; gap: var(--s3); justify-content: center; color: var(--text); }
.m-h { font-size: 19px; font-weight: 700; }
.m-row { display: grid; grid-template-columns: 34px 1fr 64px 52px 40px; align-items: center; font-size: 17px; padding: 6px 4px; border-radius: 10px; font-variant-numeric: tabular-nums; }
.m-row.m-hd { font-size: 12px; color: var(--text2); padding: 0 4px; }
.m-row.done { background: color-mix(in srgb, var(--pos, #2E8B4E) 12%, transparent); }
.m-row .mu { color: var(--muted); }
.m-ck { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--pos, #2E8B4E); color: #fff; }
.m-ck svg { width: 18px; height: 18px; } .m-ck.off { background: var(--raised); color: var(--muted); }
.m-plates { display: flex; align-items: center; justify-content: center; gap: 3px; height: 54px; }
.m-plates i { display: block; width: 11px; border-radius: 3px; } .m-plates span { width: 90px; height: 6px; border-radius: 3px; background: #9A9AA2; }
.m-toast { align-self: center; text-align: center; background: var(--surface-solid, var(--surface)); border: 1px solid var(--border); border-radius: 18px; padding: 10px 22px; box-shadow: 0 10px 30px -12px rgba(0,0,0,.35); animation: obpop 2.6s ease-in-out infinite; }
.m-toast b { display: block; font-size: 20px; } .m-toast span { font-size: 13px; color: var(--text2); }
@keyframes obpop { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.06); } 24% { transform: scale(1); } }
.m-tgt { font-size: 14px; color: var(--accent); font-weight: 600; }
.m-race { position: relative; height: 10px; border-radius: 5px; background: var(--raised); overflow: hidden; }
.m-race i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; } .m-race .g { background: color-mix(in srgb, var(--text) 18%, transparent); } .m-race .me { background: var(--accent); animation: obrace 3s ease-in-out infinite; }
@keyframes obrace { 0% { width: 30%; } 60%, 100% { width: 92%; } }
.m-cap { font-size: 13px; color: var(--text2); }
.m-chart { width: 100%; height: auto; }
.m-leg { display: flex; gap: var(--s4); font-size: 13px; color: var(--text2); } .m-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 5px; margin-right: 6px; }
.m-pr { display: flex; align-items: center; gap: var(--s3); font-size: 16px; } .m-pr span { flex: 1; } .m-pr em { font-style: normal; font-size: 12px; font-weight: 800; color: #fff; background: var(--pr, #F4B728); border-radius: 999px; padding: 2px 9px; }
.m-rest { flex-direction: row; align-items: center; gap: var(--s5); flex-wrap: wrap; }
.m-hg { width: 70px; } .m-hg svg { width: 100%; height: auto; }
.m-rt b { display: block; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; } .m-rt span { font-size: 14px; color: var(--text2); }
.m-done { flex-basis: 100%; font-size: 30px; font-weight: 900; letter-spacing: -.02em; padding: 12px 16px; border-radius: 16px; background: var(--accent); color: var(--accent-ink, #fff); }
.ob-t, .ob-hero h1 { white-space: normal; overflow-wrap: anywhere; }
.ob { overflow-x: hidden; }
/* The intro sits on the plain theme background (no header scenery) so every line reads cleanly. */
html.ob-on #bg::before, html.ob-on #bg::after, html.ob-on #bg .land, html.ob-on #bg .l1, html.ob-on #bg .l2, html.ob-on #bg .sky-stars, html.ob-on #bg .sky-sun { display: none !important; }
html.ob-on .ob-t, html.ob-on .ob-hero h1 { color: var(--text); }
html.ob-on .ob-s, html.ob-on .ob-hero p, html.ob-on .ob-top .cap { color: var(--text2); }
html.ob-on .ob-prog { background: var(--raised); }
#screen.ob { width: 100%; box-sizing: border-box; }
.ob-body, .ob-top, .ob-foot { min-width: 0; width: 100%; }
.ob-body > * { min-width: 0; max-width: 100%; }
.ob-body > .ob-tour { max-width: none; width: calc(100% + 2 * var(--s4)); }
/* Drag handles (15 Oct) */
.drag-h { flex: none; display: grid; place-items: center; width: 40px; height: 40px; margin-left: -8px; border-radius: 10px; color: var(--muted); touch-action: none; cursor: grab; }
.drag-h:active { cursor: grabbing; color: var(--text); }
.dsort > [data-dragitem] { transition: transform .18s ease; }
.dsort > .dragging { transition: none; position: relative; z-index: 5; box-shadow: 0 16px 36px -10px rgba(0,0,0,.35); background: var(--surface-solid, var(--surface)); border-radius: var(--r2, 14px); }
.btn svg { vertical-align: -4px; margin-right: 6px; }

/* ============ Climbing: the classic (pre-v7) look Job prefers ============
   Cream panels pinned to the wall with the wall showing through, uppercase labels,
   boxed kg/reps cells, chunky buttons and a floating tab bar with a raised purple Start button. */
:root:not([data-theme]) { --surface: #FFFDFA; --raised: #F6F2EC; --r2: 18px; --edge: rgba(43,33,58,.14); --lift: 0 1px 0 rgba(43,33,58,.04), 0 10px 26px -16px rgba(43,33,58,.28); }
:root:not([data-theme]) .card { border: 1px solid rgba(43,33,58,.08); box-shadow: var(--lift); border-radius: 18px; }
:root:not([data-theme]) .card:not(.nextup) { background: color-mix(in srgb, #FFFDFA 90%, transparent); -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2); }
:root:not([data-theme]) .card.nextup { border-color: transparent; }
:root:not([data-theme]) .eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
:root:not([data-theme]) .card.nextup .eyebrow { text-transform: none; letter-spacing: 0; font-size: 13px; }
:root:not([data-theme]) .kpis { gap: 8px; border-top: 0; padding-top: 0; }
:root:not([data-theme]) .kpi { padding: 12px; border-radius: 18px; background: var(--raised); border: 0 !important; }
:root:not([data-theme]) .btn { border-radius: 14px; border: 1.5px solid var(--edge); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
:root:not([data-theme]) .btn.primary, :root:not([data-theme]) .card.nextup .btn { border-color: transparent; }
:root:not([data-theme]) .btn.ghost, :root:not([data-theme]) .btn.link { border-color: transparent; box-shadow: none; }
/* logger: boxed cells and a chunky tick, like before */
:root:not([data-theme]) .sets th { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
:root:not([data-theme]) .cell { height: 46px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--edge); font-size: 18px; font-weight: 700; color: var(--text2); }
:root:not([data-theme]) .cell.edited { color: var(--text); border-color: var(--text2); }
:root:not([data-theme]) .sets tr.done .cell { background: transparent; border-color: transparent; }
:root:not([data-theme]) .check { width: 46px; height: 46px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--edge); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
:root:not([data-theme]) tr.done .check { background: var(--green); border-color: var(--green); color: #fff; }
:root:not([data-theme]) .sets tr.done td { background: color-mix(in srgb, var(--green) 13%, transparent); }
:root:not([data-theme]) .sets tr.done td:first-child { border-radius: 16px 0 0 16px; } :root:not([data-theme]) .sets tr.done td:last-child { border-radius: 0 16px 16px 0; }
/* floating tab bar with the raised Start button */
:root:not([data-theme]) #tabs { left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 536px; align-items: center; padding: 6px 8px; border-radius: 26px; border: 1px solid rgba(43,33,58,.08); background: rgba(255,253,250,.94); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 14px 34px -14px rgba(43,33,58,.35); }
:root:not([data-theme]) .tab { min-height: 50px; justify-content: center; font-size: 11px; font-weight: 600; gap: 3px; }
:root:not([data-theme]) .tab svg { width: 24px; height: 24px; }
:root:not([data-theme]) .tab-start { justify-self: center; width: 54px; height: 54px; min-height: 54px; margin-top: -18px; border-radius: 20px; background: var(--accent); color: #fff; justify-content: center; box-shadow: 0 8px 18px -8px rgba(108,63,214,.7); }
:root:not([data-theme]) .tab-start.live { background: var(--green); color: #fff; box-shadow: 0 8px 18px -8px rgba(46,139,78,.7); }
:root:not([data-theme]) .tab-start span { display: none; }
:root:not([data-theme]) #screen { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
:root:not([data-theme]) .sets tbody tr + tr td { border-top: 0; }
:root:not([data-theme]) .sgh { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--muted); }

/* ============ Theme wallpapers from Job's gallery (Oct 2026) ============

:root[data-theme="mono"] #wk { background: var(--wp) center top / cover no-repeat, var(--bg); }
:root[data-theme="mono"] .top h1 { text-shadow: none; }
/* Spider by day: light cards on the Daylight Verse sky, red stays the accent */
:root[data-theme="spidey"][data-tod="day"] {
  color-scheme: light;
  --bg: #EEF1F6; --surface: #FFFFFF; --surface-solid: #FFFFFF; --raised: #EEF1F7;
  --border: rgba(20,30,70,.08); --edge: rgba(20,30,70,.16);
  --text: #121A3A; --text2: rgba(18,26,58,.64); --muted: rgba(18,26,58,.42);
  --accent: #D61F17; --accent-dark: #A3150F; --accent-ink: #FFFFFF;
  --green: #22995E; --red: #D9342C; --blue: #3E67D8; --pos: #22995E; --neg: #D9342C;
  --shadow: 0 1px 2px rgba(20,30,70,.06), 0 6px 18px -10px rgba(20,30,70,.25);
  --hdr-ink: #121A3A; --hdr-ink2: rgba(18,26,58,.64);
}
:root[data-theme="spidey"][data-tod="day"] #tabs, :root[data-theme="spidey"][data-tod="day"] .wk-head { background: rgba(255,255,255,.92); }
:root[data-theme="spidey"][data-tod="day"] .tab.on { color: var(--accent); }

/* Summit: craggy mountain-rock dots; Skyline: web-cell hexagons (Job liked Boulder's rock dots) */
:root[data-theme="cliffs"] .dot, :root[data-theme="cliffs"] .sdot, :root[data-theme="cliffs"] .split .tag { border-radius: 0; clip-path: polygon(8% 62%, 22% 28%, 40% 12%, 56% 20%, 70% 6%, 88% 30%, 100% 62%, 92% 92%, 50% 100%, 6% 92%); }
:root[data-theme="cliffs"] .week .d:nth-child(2n) .dot { clip-path: polygon(4% 70%, 18% 34%, 34% 26%, 48% 4%, 66% 22%, 82% 18%, 98% 52%, 96% 90%, 54% 100%, 10% 94%); }
:root[data-theme="cliffs"] .dot { width: 38px; height: 34px; border: 0; background: var(--raised); box-shadow: inset 0 -5px 0 rgba(0,0,0,.14), inset 4px 4px 0 rgba(255,255,255,.3); }
:root[data-theme="cliffs"] .dot.done { box-shadow: inset 0 -5px 0 rgba(0,0,0,.25), inset 4px 4px 0 rgba(255,255,255,.25); }
:root[data-theme="spidey"] .dot, :root[data-theme="spidey"] .sdot, :root[data-theme="spidey"] .split .tag { border-radius: 0; clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); }
:root[data-theme="spidey"] .dot { width: 36px; height: 38px; border: 0; background: var(--raised) url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 38'%3E%3Cg fill='none' stroke='%23ffffff' stroke-opacity='.18' stroke-width='.8'%3E%3Cpath d='M18 0V38M2 9.5L34 28.5M34 9.5L2 28.5'/%3E%3Cpath d='M18 8L27 13V25L18 30L9 25V13Z'/%3E%3C/g%3E%3C/svg%3E") center / 100% 100%; }
:root[data-theme="spidey"] .dot.today { outline: 0; box-shadow: inset 0 0 0 2px var(--accent); }
:root[data-theme="cliffs"] .split .tag, :root[data-theme="spidey"] .split .tag { align-self: center; min-height: 0; width: 34px; height: 30px; }

:root[data-theme="spidey"] #bg::after, :root[data-theme="spidey"] #bg .land, :root[data-theme="spidey"] #bg .l1, :root[data-theme="spidey"] #bg .l2 { display: none !important; }
:root[data-theme="spidey"] #bg::before { inset: 0; height: auto; background: var(--wp) center top / cover no-repeat, var(--bg); }
:root[data-theme="spidey"] #wk { background: var(--wp) center top / cover no-repeat, var(--bg); }
/* Skyline: every split colour is the hero red (Job: "keep this all red") */
:root[data-theme="spidey"] [style*="--split"] { --split: var(--accent) !important; }
:root[data-theme="spidey"] .tag[style], :root[data-theme="spidey"] .sdot[style], :root[data-theme="spidey"] .dot.done[style], :root[data-theme="spidey"] .dot[style*="background"] { background-color: var(--accent) !important; color: #fff !important; }
:root[data-theme="spidey"] .spark path { stroke: var(--accent) !important; } :root[data-theme="spidey"] .spark circle { fill: var(--accent) !important; }

/* Intro, polished (Oct 2026): one calm dark look for every step; themes are previewed, not applied, until the end */
html.ob-on #bg::before, html.ob-on #bg .l1, html.ob-on #bg .l2 { display: none !important; }
html.ob-on body, html.ob-on #bg { background: radial-gradient(120% 60% at 50% 0%, #1A1C24 0%, #0B0C10 60%) !important; }
#screen.ob { padding-top: calc(env(safe-area-inset-top, 0px) + var(--s4)); }
.ob-top { gap: var(--s2); }
.ob-prog { height: 4px; }
.ob-eb { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--muted); margin-bottom: calc(-1 * var(--s2)); }
.ob-t, .ob-hero h1 { font-size: 30px; line-height: 36px; letter-spacing: -.02em; font-weight: 700; }
.ob-s, .ob-hero p { font-size: 16px; line-height: 22px; }
.ob-body .tmpl button, .ob-themes button, .ob-body .sgrp { background: #15161C; border: 1px solid rgba(255,255,255,.07); box-shadow: none; }
.ob-body .tmpl button.on, .ob-themes button.on { border-color: #F2F2F4; background: #1C1D25; }
.ob-body .sgh { margin-top: var(--s2); }
.ob-body .seg { background: #15161C; }
.ob-body .input { background: #15161C; border: 1px solid rgba(255,255,255,.08); }
.ob-foot .btn.primary { background: #F2F2F4; color: #0A0A0C; border-radius: 14px; font-weight: 600; }

// ---------- utils ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));

const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fmtDate = (s, o = {}) => { const d = parseYmd(s); return (o.wd ? WD[d.getDay()] + ' ' : '') + d.getDate() + ' ' + MON[d.getMonth()] + (o.y ? ' ' + d.getFullYear() : ''); };
const mondayOf = s => { const d = parseYmd(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return ymd(d); };
const relDay = s => { const n = daysBetween(s, today()); return n === 0 ? 'today' : n === 1 ? 'yesterday' : n < 7 ? n + ' days ago' : fmtDate(s, { wd: true }); };
const fmtDur = ms => { const m = Math.max(0, Math.floor(ms / 6e4)); if (m < 1) return 'under 1 min'; return m >= 60 ? Math.floor(m / 60) + 'h ' + pad2(m % 60) + 'm' : m + ' min'; };
const clock = s => Math.floor(s / 60) + ':' + pad2(Math.floor(s % 60));
// Wall-clock time like 3:00 pm (start of a workout, end of a rest).
const hm = t => { const d = new Date(t); let h = d.getHours(); const ap = h < 12 ? 'am' : 'pm'; h = h % 12 || 12; return h + ':' + pad2(d.getMinutes()) + ' ' + ap; };
const plural = (n, w, ws) => n + ' ' + (n === 1 ? w : (ws || w + 's'));
const fmtRest = v => Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0');
const REST_OPTS_X = v => v && ![60, 90, 120, 150, 180, 240, 300, 360, 420, 480, 600].includes(v) ? [v] : [];
const n0 = v => Math.round(v).toLocaleString('en-US');
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let hapEl = null;
// Android vibrates; iPhone (iOS 18+) gives a light tap when a hidden switch is toggled.
const buzz = ms => {
  try {
    if (navigator.vibrate) { navigator.vibrate(ms); return; }
    if (!IOS) return;
    if (!hapEl) { hapEl = document.createElement('label'); hapEl.setAttribute('aria-hidden', 'true'); hapEl.style.cssText = 'position:fixed;left:-200px;top:0;opacity:0;pointer-events:none'; hapEl.innerHTML = '<input type="checkbox" switch tabindex="-1">'; document.body.appendChild(hapEl); }

};
