  --edge: rgba(43, 33, 58, .14);
  --text: #221E2B;
  --text2: #5F5A69;
  --muted: #98929F;
  --accent: #6C3FD6;
  --accent-dark: #4B27A8;
  --accent-ink: #FFFFFF;
  --yellow: #F4B728;
  --green: #2E8B4E;
  --red: #E0412F;
  --blue: #4A78E0;
  --cyan: #4A78E0;
  --violet: #6C3FD6;
  --pos: #2E8B4E;
  --neg: #E0412F;
  --neu: #5F5A69;
  --font: "Nunito", ui-rounded, -apple-system, "SF Pro Rounded", system-ui, "Segoe UI", Roboto, sans-serif;
  --num: var(--font);
  --mono: var(--font);
  --r: 24px;
  --tabh: 64px;
  --ease: cubic-bezier(.2, .9, .25, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --lift: 0 1px 0 rgba(43,33,58,.04), 0 10px 26px -16px rgba(43,33,58,.28);
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.45; font-weight: 600;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
* { box-sizing: border-box; }
button, label, summary, a { touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sec { color: var(--text2); }
.pos { color: var(--pos); } .neg { color: var(--neg); } .neu { color: var(--neu); }
.acc { color: var(--accent); }

/* ---------- Background: a chalky wall ---------- */
#bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: var(--bg); }
#bg .orb { display: none; }
#bg .noise { position: absolute; inset: 0; opacity: .09; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .17 0 0 0 0 .13 0 0 0 0 .22 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }
#screen {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(var(--tabh) + 48px + env(safe-area-inset-bottom, 0px));
}
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* Screens bounce in, panels one after another */
#screen.enter > .stack > * { animation: rise .55s var(--spring) both; }
#screen.enter > .stack > *:nth-child(2) { animation-delay: .04s; }
#screen.enter > .stack > *:nth-child(3) { animation-delay: .08s; }
#screen.enter > .stack > *:nth-child(4) { animation-delay: .12s; }
#screen.enter > .stack > *:nth-child(n+5) { animation-delay: .16s; }
@keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }

/* ---------- Type ---------- */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 2px 4px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
h1 { font-weight: 900; font-size: 32px; line-height: 1.1; margin: 4px 0 0; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 800; margin: 8px 0 0; }
h3 { font-size: 16px; font-weight: 800; margin: 0; }
.cap { font-size: 13px; color: var(--text2); }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--text2); font-size: 15px; min-height: 44px; font-weight: 700; }
.hero { display: flex; align-items: center; gap: 10px; font-size: 40px; font-weight: 900; line-height: 1.05; letter-spacing: -.01em; overflow-wrap: anywhere; }
.sdot { width: 12px; height: 12px; border-radius: 4px; flex: none; }

/* ---------- Panels ---------- */
.card {
  position: relative; display: block; width: 100%; min-width: 0; color: inherit; text-align: left; padding: 18px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--lift);
}
.card.row { display: flex; }
.card.tight { padding: 14px 16px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
/* The next workout is painted in its split's colour */
.card.nextup { background: var(--split, var(--accent)); color: var(--ink, #fff); border-color: transparent; box-shadow: 0 6px 0 color-mix(in srgb, var(--split, var(--accent)) 70%, #000 30%), 0 18px 30px -18px rgba(43,33,58,.5); margin-bottom: 6px; overflow: hidden; }
.card.nextup::before { content: ""; position: absolute; width: 180px; height: 150px; right: -50px; top: -40px; border-radius: 58% 42% 50% 50% / 45% 55% 45% 55%; background: rgba(255,255,255,.16); pointer-events: none; }
.card.nextup > * { position: relative; }
.card.nextup .eyebrow, .card.nextup .cap, .card.nextup .sec, .card.nextup .muted { color: inherit !important; opacity: .72; }
.card.nextup .sdot { display: none; }
.card.nextup .nextlist .row { border-top-color: color-mix(in srgb, currentColor 18%, transparent); }
.card.nextup .btn.primary { background: var(--ink, #fff); color: var(--split, var(--accent)); box-shadow: 0 4px 0 color-mix(in srgb, var(--ink, #fff) 60%, var(--split, #000)); }
.card.nextup .btn.primary:active { box-shadow: 0 1px 0 color-mix(in srgb, var(--ink, #fff) 60%, var(--split, #000)); }
.big { font-variant-numeric: tabular-nums; font-size: 48px; font-weight: 900; line-height: 1; letter-spacing: -.02em; }
.mid { font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 900; line-height: 1.1; }
.unit { font-size: 15px; font-weight: 700; color: var(--text2); margin-left: 4px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.kpi { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 12px; border-radius: 18px; background: var(--raised); }
.kpi b { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 900; line-height: 1.1; }
.kpi span { font-size: 12px; color: var(--muted); font-weight: 700; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ---------- Buttons: chunky, they press in ---------- */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px; padding: 0 22px; border-radius: 18px; background: var(--surface); border: 1.5px solid var(--edge); box-shadow: 0 3px 0 var(--edge); font-weight: 800; font-size: 16px; color: var(--text); transition: transform .35s var(--spring), box-shadow .15s; }
.btn:active { transform: translateY(3px) scale(.98); box-shadow: 0 0 0 var(--edge); transition-duration: .08s; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 4px 0 var(--accent-dark); }
.btn.primary:active { box-shadow: 0 1px 0 var(--accent-dark); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
.btn.danger { color: var(--neg); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 0 16px; font-size: 14px; border-radius: 14px; }
.btn:disabled { opacity: .4; }
.link { color: var(--accent); font-size: 14px; font-weight: 800; min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; }
.icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 14px; color: var(--text2); flex: none; transition: transform .35s var(--spring); }
.icon-btn:disabled { opacity: .3; }
.icon-btn:active { transform: scale(.88); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--edge); background: var(--surface); font-size: 14px; font-weight: 800; color: var(--text2); white-space: nowrap; transition: transform .35s var(--spring), background .2s, color .2s; }
.chip:active { transform: scale(.92); }
.chip.on { color: #fff; background: var(--accent); border-color: var(--accent); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.seg { display: flex; background: var(--raised); border-radius: 18px; padding: 4px; gap: 2px; }
.seg button { flex: 1; min-height: 38px; border-radius: 14px; font-size: 14px; font-weight: 800; color: var(--text2); transition: background .25s, color .25s, transform .35s var(--spring); }
.seg button:active { transform: scale(.94); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 2px 0 var(--edge); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 10px; background: var(--raised); color: var(--text2); white-space: nowrap; }
.pill.pr { background: var(--yellow); color: #3B2A00; }

/* ---------- Lists ---------- */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1.5px dashed var(--border); min-height: 54px; text-align: left; width: 100%; }
.li:last-child { border-bottom: 0; }
.li .t { font-weight: 800; }
.li .s { font-size: 13px; color: var(--text2); }
.chev { color: var(--muted); flex: none; }

/* ---------- Fields ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-size: 13px; color: var(--text2); font-weight: 700; }
.input { width: 100%; min-height: 50px; background: var(--surface); border: 1.5px solid var(--edge); border-radius: 16px; padding: 0 14px; font-size: 16px; font-weight: 700; transition: border-color .2s, box-shadow .2s; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); outline: none; }
textarea.input { padding: 12px 14px; min-height: 80px; resize: vertical; }
.input.sm { min-height: 42px; padding: 0 10px; font-size: 16px; border-radius: 12px; } /* 16px stops iPhone zooming in on tap */

/* ---------- Tab bar ---------- */
#tabs {
  position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: 536px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 6px 8px; border-radius: 26px;
  background: rgba(255, 253, 250, .94); border: 1px solid var(--border);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 14px 34px -14px rgba(43,33,58,.35);
}
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); min-height: 50px; justify-content: center; font-weight: 800; transition: color .25s, transform .35s var(--spring); }
.tab:active { transform: scale(.88); }
.tab.on { color: var(--accent); }
.tab.on svg { animation: hop .45s var(--spring); }
@keyframes hop { 40% { transform: translateY(-4px) scale(1.12); } }
.tab svg { width: 24px; height: 24px; }
.tab-start { justify-self: center; width: 54px; height: 54px; margin-top: -18px; border-radius: 20px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 var(--accent-dark), 0 12px 22px -10px rgba(108,63,214,.7); transition: transform .35s var(--spring), box-shadow .1s; }
.tab-start:active { transform: translateY(3px) scale(.95); box-shadow: 0 1px 0 var(--accent-dark); }
.tab-start svg { width: 26px; height: 26px; }
.tab-start.live { background: var(--green); box-shadow: 0 4px 0 #1E6337; }

/* ---------- Today ---------- */
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring .c { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; color: var(--text2); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week .d { padding: 0; background: none; border: 0; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--muted); }
.dot { width: 34px; height: 34px; border-radius: 12px; border: 1.5px dashed var(--edge); background: transparent; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: #fff; }
.dot.done { background: var(--text); border: 0; color: #fff; }
.dot.miss { border-color: var(--neg); border-style: solid; color: var(--neg); }
.dot.today { border-color: var(--accent); border-style: solid; border-width: 2.5px; }
.dot.future { opacity: .45; }
#screen.enter .dot.done { animation: popIn .5s var(--spring) both; }
#screen.enter .week .d:nth-child(2) .dot { animation-delay: .04s; } #screen.enter .week .d:nth-child(3) .dot { animation-delay: .08s; }
#screen.enter .week .d:nth-child(4) .dot { animation-delay: .12s; } #screen.enter .week .d:nth-child(5) .dot { animation-delay: .16s; }
#screen.enter .week .d:nth-child(6) .dot { animation-delay: .2s; } #screen.enter .week .d:nth-child(7) .dot { animation-delay: .24s; }
@keyframes popIn { from { transform: scale(0); } }
.nextlist { margin-top: 16px; }
.nextlist .row { font-size: 14px; padding: 9px 0; border-top: 1.5px dashed var(--border); }

/* ---------- Charts ---------- */
.chart { position: relative; width: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg path.draw { stroke-dasharray: 1; stroke-dashoffset: 0; }
#screen.enter .chart svg path.draw { animation: draw 1.1s .15s var(--ease) both; }
@keyframes draw { from { stroke-dashoffset: 1; } }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font); font-weight: 700; }
.chart .tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--text); color: #fff; border-radius: 10px; padding: 4px 10px; font-size: 12px; font-weight: 800; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text2); flex-wrap: wrap; font-weight: 700; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); grid-auto-columns: minmax(6px, 1fr); gap: 3px; }
.heat i { aspect-ratio: 1; max-width: 100%; border-radius: 4px; background: rgba(43,33,58,.06); display: block; }
.heat i.l1 { background: color-mix(in srgb, var(--accent) 25%, transparent); } .heat i.l2 { background: color-mix(in srgb, var(--accent) 50%, transparent); } .heat i.l3 { background: color-mix(in srgb, var(--accent) 75%, transparent); } .heat i.l4 { background: var(--accent); }
.heat i.sk { background: transparent; box-shadow: inset 0 0 0 1.5px var(--neg); }
.heat i.out { visibility: hidden; }
.hbar { display: grid; grid-template-columns: 92px 1fr 32px; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.hbar .b { height: 10px; border-radius: 6px; background: rgba(43,33,58,.07); overflow: hidden; }
.hbar .b i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transform-origin: left; }
#screen.enter .hbar .b i { animation: grow .8s .15s var(--spring) both; }
@keyframes grow { from { transform: scaleX(0); } }

/* ---------- Split rows ---------- */
.split { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; overflow: hidden; }
.split .tag { width: 6px; height: 46px; border-radius: 3px; flex: none; }
.split h3 { font-size: 20px; font-weight: 900; }
.spark { width: 72px; height: 28px; flex: none; }

/* ---------- Workout overlay ---------- */
#wk { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
#wk[hidden] { display: none !important; }
.wk-head { padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--border); background: rgba(255,253,250,.94); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.wkname { font-size: 19px; font-weight: 900; line-height: 1.2; }
.wk-body { flex: 1; overflow-y: auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(130px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.race { height: 10px; border-radius: 6px; background: rgba(43,33,58,.08); position: relative; margin-top: 12px; overflow: hidden; }
.race i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 6px; transition: width .6s var(--spring); }
.race i.ghost { background: rgba(43,33,58,.14); }
.race i.me { background: var(--accent); }
.race i.me.ahead { background: var(--green); }
.sets { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-variant-numeric: tabular-nums; margin-top: 6px; }
.sets th { font-size: 11px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; text-align: center; padding: 4px 2px; }
.sets th:nth-child(2) { text-align: left; }
.sets td { padding: 2px; text-align: center; transition: background .3s; }
.sets tr.done .cell { background: transparent; border-color: transparent; color: var(--text); }
.sets tr.done td { background: color-mix(in srgb, var(--green) 13%, transparent); }
.sets tr.done td:first-child { border-radius: 16px 0 0 16px; } .sets tr.done td:last-child { border-radius: 0 16px 16px 0; }
.setno { width: 32px; height: 40px; border-radius: 12px; font-weight: 900; font-size: 14px; color: var(--text2); }
.setno.warm { color: #B7840B; } .setno.drop { color: var(--blue); } .setno.fail { color: var(--neg); }
.prev { text-align: left !important; font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; }
.cell { width: 100%; min-width: 56px; height: 46px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--edge); font-size: 18px; font-weight: 900; color: var(--text2); transition: transform .3s var(--spring); }
.cell.edited { color: var(--text); border-color: var(--text2); }
.check { width: 46px; height: 46px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--edge); box-shadow: 0 3px 0 var(--edge); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); transition: transform .35s var(--spring), background .2s; }
tr.done .check { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 3px 0 #1E6337; }
tr.pop .check { animation: checkPop .5s var(--spring); }
@keyframes checkPop { 0% { transform: scale(.6) rotate(-12deg); } 60% { transform: scale(1.18) rotate(4deg); } 100% { transform: none; } }
tr.pop td { animation: rowFlash .7s ease-out; }
@keyframes rowFlash { 0% { background: color-mix(in srgb, var(--green) 35%, transparent); } }
.cmp { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; font-weight: 700; margin-top: 8px; }
.restpill { position: fixed; z-index: 45; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 22px; background: var(--text); color: #fff; box-shadow: 0 14px 30px -12px rgba(43,33,58,.6); animation: pillIn .45s var(--spring); }
@keyframes pillIn { from { transform: translate(-50%, 30px) scale(.8); opacity: 0; } }
.restpill .t { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 900; line-height: 1; min-width: 72px; text-align: center; color: #fff; }
.restpill .bar { position: absolute; left: 22px; right: 22px; bottom: 4px; height: 3px; background: rgba(255,255,255,.18); border-radius: 2px; overflow: hidden; }
.restpill .bar i { display: block; height: 100%; background: var(--yellow); }
.restpill .icon-btn { width: 44px; height: 44px; font-size: 13px; font-weight: 900; color: #fff; }
.glow { animation: prGlow 1s var(--spring); }
@keyframes prGlow { 0% { transform: scale(.6); background: var(--yellow); } 50% { transform: scale(1.25) rotate(-8deg); background: var(--yellow); } }
.pop { animation: pop .4s var(--spring); }
@keyframes pop { 0% { transform: scale(.9); } 100% { transform: scale(1); } }

/* PR confetti */
.confetti { position: fixed; inset: 0; z-index: 90; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 10px; height: 8px; border-radius: 50% 40% 55% 45%; animation: fall var(--d, 1.4s) cubic-bezier(.25, .6, .4, 1) forwards; }
@keyframes fall { to { transform: translate(var(--x), 105vh) rotate(var(--r)); } }

/* ---------- Sheets ---------- */
#sheets { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.scrim { position: absolute; inset: 0; background: rgba(34,30,43,.35); pointer-events: auto; animation: fade .3s ease; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 92%; overflow-y: auto; pointer-events: auto;
  background: var(--surface); border-radius: 28px 28px 0 0; box-shadow: 0 -20px 60px rgba(43,33,58,.25);
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  animation: up .5s var(--spring);
}
.sheet .card { background: var(--raised); box-shadow: none; border: 0; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--edge); margin: 0 auto 12px; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.keys button { min-height: 54px; border-radius: 16px; background: var(--raised); box-shadow: 0 3px 0 var(--edge); font-size: 22px; font-weight: 900; transition: transform .3s var(--spring), box-shadow .1s; }
.keys button.q { font-size: 14px; color: var(--text2); }
.keys button.done { background: var(--accent); color: #fff; font-size: 16px; box-shadow: 0 4px 0 var(--accent-dark); }
.ruler { position: relative; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; height: 64px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); }
.ruler::-webkit-scrollbar { display: none; }
.ruler-in { display: flex; align-items: flex-end; height: 100%; }
.ruler-in i { flex: none; width: var(--tw, 12px); height: 18px; scroll-snap-align: center; position: relative; }
.ruler-in i::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 2px; height: 100%; background: var(--muted); border-radius: 1px; }
.ruler-in i.m::after { height: 32px; background: var(--text2); }
.ruler-in i.m b { position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); font-weight: 800; }
.ruler-mark { position: absolute; left: 50%; top: 22px; bottom: 0; width: 4px; margin-left: -2px; background: var(--accent); border-radius: 2px; pointer-events: none; }
.toast { position: fixed; z-index: 80; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); background: var(--text); color: #fff; font-weight: 800; border-radius: 18px; padding: 12px 20px; font-size: 14px; box-shadow: 0 14px 30px -12px rgba(43,33,58,.6); animation: toastIn .5s var(--spring); max-width: calc(100% - 32px); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -20px) scale(.9); } }
.splash { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text2); }
.wordmark { font-weight: 900; font-size: 34px; line-height: 1; letter-spacing: -.02em; color: var(--text); }
.wordmark span { color: var(--accent); }
.assume { display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: var(--text2); }
.assume li { margin-left: -6px; }
.note { font-size: 13px; color: var(--text2); background: var(--raised); border-radius: 16px; padding: 12px 14px; font-weight: 700; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl td, .tbl th { padding: 10px 4px; border-bottom: 1.5px dashed var(--border); text-align: left; }
.tbl th { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 900; }
.tbl td.r, .tbl th.r { text-align: right; }
.empty { text-align: center; color: var(--text2); padding: 24px 8px; font-size: 14px; }
.ex-name { font-weight: 900; font-size: 18px; text-align: left; }

/* Skeleton loading (instead of a spinner) */
.skel { position: relative; z-index: 1; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 0; display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin: 0 auto; }
.skel i { display: block; border-radius: 16px; background: linear-gradient(90deg, rgba(43,33,58,.05) 0%, rgba(43,33,58,.11) 50%, rgba(43,33,58,.05) 100%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
.skel hr { border: 0; border-top: 1.5px dashed var(--border); margin: 6px 0; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .confetti { display: none; } }
@media (max-width: 360px) { .big { font-size: 40px; } .hero { font-size: 32px; } h1 { font-size: 27px; } .kpis { grid-template-columns: 1fr 1fr; } }

/* iPhone press feedback */
.card[data-a], .li, .split { transition: transform .4s var(--spring); }
.card[data-a]:active, .split:active { transform: scale(.97); transition-duration: .1s; }
.li:active { opacity: .6; }
.cell:active, .keys button:active { transform: scale(.92); }
.check:active { transform: translateY(2px) scale(.94); box-shadow: 0 1px 0 var(--edge); }
.keys button:active { box-shadow: 0 0 0 var(--edge); }

/* ---------- Cliffs: outdoor crag, mountains, water below ---------- */
:root[data-theme="cliffs"] {
  --bg: #F3DDC4; --surface: rgba(255,250,244,.78); --surface-solid: #FFF9F2; --raised: #F4E8DA;
  --text: #2A2320; --text2: #6A5A50; --muted: #A08F82; --border: rgba(60,40,30,.1); --edge: rgba(60,40,30,.2);
  --accent: #1F7A99; --accent-dark: #12526A; --accent-ink: #FFFFFF;
  --yellow: #F2A93B; --green: #3F8F5A; --red: #D2553A; --blue: #1F7A99;
}
:root[data-theme="cliffs"] #bg { background: linear-gradient(180deg, var(--sky1, #6FB3E6) 0%, var(--sky2, #A9D4EE) 48%, var(--sky3, #DCEEF6) 72%); }
#bg .sky-stars, #bg .sky-sun, #bg .land, #bg .tint { display: none; }
:root[data-theme="cliffs"] #bg .sky-stars { display: block; position: absolute; inset: 0 0 35% 0; opacity: var(--stars, 0); background: radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 30% 8%, #fff, transparent), radial-gradient(1.4px 1.4px at 48% 26%, #fff, transparent), radial-gradient(1px 1px at 66% 12%, #fff, transparent), radial-gradient(1.3px 1.3px at 84% 22%, #fff, transparent), radial-gradient(1px 1px at 22% 40%, #fff, transparent), radial-gradient(1.2px 1.2px at 74% 38%, #fff, transparent), radial-gradient(1px 1px at 92% 6%, #fff, transparent), radial-gradient(1px 1px at 5% 30%, #fff, transparent), radial-gradient(1.1px 1.1px at 58% 44%, #fff, transparent); animation: twinkle 4s ease-in-out infinite alternate; transition: opacity 2s; }
@keyframes twinkle { to { filter: brightness(.6); } }
:root[data-theme="cliffs"] #bg .sky-sun { display: block; position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; left: var(--sunx, 70%); top: var(--suny, 30%); border-radius: 50%; background: radial-gradient(circle, #FFF6D8 0 40%, rgba(255,214,140,.55) 41%, rgba(255,190,120,0) 70%); transition: left 2s, top 2s; }
:root[data-theme="cliffs"] #bg .sky-sun.moon { width: 52px; height: 52px; margin: -26px 0 0 -26px; background: radial-gradient(circle at 38% 38%, #FBF7EC 0 45%, #E3DCC8 62%, rgba(227,220,200,0) 72%); box-shadow: 0 0 40px 6px rgba(220,230,255,.25); }

:root[data-theme="cliffs"] #bg .tint { display: block; position: absolute; inset: 0; background: var(--tint, transparent); mix-blend-mode: multiply; transition: background 2s; }
:root[data-theme="cliffs"][data-tod="night"] {
  --surface: rgba(18,22,44,.86); --surface-solid: #12162C; --raised: #1F2544;
  --text: #F1EEF6; --text2: #B4B3CC; --muted: #7D7F9E; --accent: #5FB3D3; --accent-dark: #2D6E88;
}
:root[data-theme="cliffs"][data-tod="night"] #tabs, :root[data-theme="cliffs"][data-tod="night"] .wk-head { background: rgba(18,22,44,.94); }
:root[data-theme="cliffs"] #bg .noise { opacity: .05; }
:root[data-theme="cliffs"] #bg::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 13%; background: linear-gradient(90deg, transparent 0 30%, rgba(255,255,255,.22) 45%, transparent 60%) 0 0 / 200% 100%; animation: shimmer 6s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
:root[data-theme="cliffs"] .card { -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); }
:root[data-theme="cliffs"] .top h1, :root[data-theme="cliffs"] .top .eyebrow, :root[data-theme="cliffs"] #screen > .stack > h1 { color: #fff; text-shadow: 0 1px 10px rgba(0,0,0,.3); }
:root[data-theme="cliffs"][data-tod="night"] { --surface: rgba(18,22,44,.8); }
:root[data-theme="cliffs"] #tabs, :root[data-theme="cliffs"] .wk-head { background: rgba(255,249,242,.92); }

/* ---------- Miles inspired: black and red, comic halftone, venom-blast electricity (no logos) ---------- */
:root[data-theme="miles"] {
  --bg: #08080B; --surface: #141419; --surface-solid: #141419; --raised: #20202A;
  --text: #FFFFFF; --text2: #B7B7C4; --muted: #70707E;
  --accent: #E3262E; --accent-dark: #7E0E13; --accent-ink: #FFFFFF; --zap: #FFE94D;
  --yellow: #FFE94D; --green: #E3262E; --red: #FF6B63; --blue: #7FD8FF; --pos: #7FE0A6; --neg: #FF6B63; --neu: #B7B7C4;
}
:root[data-theme="miles"] #bg { background: radial-gradient(rgba(227,38,46,.22) 1.1px, transparent 1.6px) 0 0 / 9px 9px, radial-gradient(ellipse 80% 60% at 100% 0%, rgba(227,38,46,.25), transparent 70%), var(--bg); }
:root[data-theme="miles"] #bg .noise { display: none; }
:root[data-theme="miles"] #bg::before { content: ""; position: absolute; width: 120vmax; height: 120vmax; left: -40vmax; bottom: -50vmax; background: var(--web) center / contain no-repeat; opacity: .1; filter: sepia(1) saturate(8) hue-rotate(-50deg); }
:root[data-theme="miles"] #bg::after { content: ""; position: absolute; inset: 0; background: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='560' viewBox='0 0 400 560'%3E%3Cg fill='none' stroke-linejoin='round' stroke-linecap='round'%3E%3Cg stroke='%23FFE94D' stroke-width='5' opacity='.35'%3E%3Cpath d='M79 201L78 232L66 262L79 293L92 324L93 355L93 386L82 417'/%3E%3Cpath d='M21 99L2 129L15 159L3 189L-8 219L-29 249L-7 279L4 309'/%3E%3Cpath d='M335 177L327 198L327 218L310 239L330 259L325 280L309 301L323 321'/%3E%3Cpath d='M65 277L67 305L60 332L60 360L46 388L26 416L42 444L30 471'/%3E%3Cpath d='M301 47L318 83L329 120L341 157L345 193L355 230L338 266L337 303'/%3E%3C/g%3E%3Cg stroke='%23FFFBE0' stroke-width='1.6'%3E%3Cpath d='M79 201L78 232L66 262L79 293L92 324L93 355L93 386L82 417'/%3E%3Cpath d='M21 99L2 129L15 159L3 189L-8 219L-29 249L-7 279L4 309'/%3E%3Cpath d='M335 177L327 198L327 218L310 239L330 259L325 280L309 301L323 321'/%3E%3Cpath d='M65 277L67 305L60 332L60 360L46 388L26 416L42 444L30 471'/%3E%3Cpath d='M301 47L318 83L329 120L341 157L345 193L355 230L338 266L337 303'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") center / 400px 560px; opacity: 0; animation: zap 7s infinite; }
@keyframes zap { 0%, 58%, 61%, 63%, 100% { opacity: 0; } 59%, 62% { opacity: .55; } 60% { opacity: .15; } }
:root[data-theme="miles"] .card.nextup { background: linear-gradient(150deg, #1D1D25, #0A0A0E); color: #fff; border: 2px solid var(--accent); box-shadow: 0 6px 0 var(--accent-dark), 0 0 30px -6px rgba(227,38,46,.6); }
:root[data-theme="miles"] .card.nextup::before { width: 300px; height: 260px; right: -70px; top: -60px; border-radius: 0; background: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 260'%3E%3Cg fill='none' stroke-linejoin='round' stroke-linecap='round'%3E%3Cg stroke='%23FFE94D' stroke-width='7' opacity='.35'%3E%3Cpath d='M92 -5L77 17L58 38L53 60L72 82L85 104L97 125L84 147'/%3E%3Cpath d='M158 4L141 23L128 42L147 61L161 80L175 99L188 119L175 138'/%3E%3Cpath d='M108 21L124 47L140 72L122 98L127 123L135 149L135 174L121 200'/%3E%3C/g%3E%3Cg stroke='%23FFFBE0' stroke-width='2'%3E%3Cpath d='M92 -5L77 17L58 38L53 60L72 82L85 104L97 125L84 147'/%3E%3Cpath d='M158 4L141 23L128 42L147 61L161 80L175 99L188 119L175 138'/%3E%3Cpath d='M108 21L124 47L140 72L122 98L127 123L135 149L135 174L121 200'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") center / contain no-repeat; animation: crackle 2.4s steps(1) infinite; filter: drop-shadow(0 0 6px #FFE94D); }
@keyframes crackle { 0% { opacity: .9; transform: none; } 20% { opacity: .2; transform: scaleX(-1); } 35% { opacity: 1; transform: none; } 50% { opacity: .4; transform: translateY(6px); } 70% { opacity: .95; transform: scaleX(-1) translateY(-4px); } 85% { opacity: .3; } }
:root[data-theme="miles"] .card.nextup .btn.primary { background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-dark), 0 0 18px -2px rgba(255,233,77,.55); }
:root[data-theme="miles"] .btn.primary:active, :root[data-theme="miles"] .tab-start:active, :root[data-theme="miles"] tr .check:active { box-shadow: 0 0 0 3px var(--zap), 0 0 26px var(--zap) !important; }
:root[data-theme="miles"] tr.done .check { box-shadow: 0 3px 0 var(--accent-dark), 0 0 14px rgba(255,233,77,.6); }
:root[data-theme="miles"] .sets tr.done td { background: rgba(227,38,46,.16); }
:root[data-theme="miles"] .pill.pr { background: var(--zap); color: #08080B; }
:root[data-theme="miles"] #tabs, :root[data-theme="miles"] .wk-head { background: rgba(20,20,25,.94); }
:root[data-theme="miles"] .tab.on { color: #fff; }
:root[data-theme="miles"] .tab-start { box-shadow: 0 4px 0 var(--accent-dark), 0 0 22px -4px rgba(255,233,77,.6); }
:root[data-theme="miles"] .cele { border-color: var(--zap); box-shadow: 0 6px 0 var(--accent-dark), 0 0 40px -6px var(--zap); }
:root[data-theme="miles"] .cele b { text-shadow: 0 0 12px rgba(255,233,77,.8); }
:root[data-theme="miles"] .hg-sand { fill: var(--zap); filter: drop-shadow(0 0 4px var(--zap)); }
@media (prefers-reduced-motion: reduce) { #bg::before, #bg::after, .card.nextup::before { animation: none !important; } }

/* Theme picker swatches */
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 2px 0 8px; }
.theme-opt { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 6px; border-radius: 18px; border: 2px solid var(--border); font-size: 13px; font-weight: 800; color: var(--text2); transition: transform .35s var(--spring); }
.theme-opt:active { transform: scale(.94); }
.theme-opt.on { border-color: var(--accent); color: var(--text); }
.theme-opt i { width: 100%; height: 44px; border-radius: 12px; display: block; }

/* ---------- Rest timer: hourglass pop-up ---------- */
.restpop { position: fixed; z-index: 45; left: 12px; right: 12px; max-width: 420px; margin: 0 auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 6px; border-radius: 28px; background: var(--surface); border: 1px solid var(--edge); box-shadow: 0 20px 50px -16px rgba(0,0,0,.5); animation: popUp .55s var(--spring); }
@keyframes popUp { from { transform: translateY(60%) scale(.85); opacity: 0; } }
.restpop .hg { width: 84px; height: 126px; margin: -6px auto 0; animation: flip .8s var(--spring); }
@keyframes flip { from { transform: rotate(180deg); } }
.restpop .t { text-align: center; font-size: 46px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.restpop.paused .t { animation: blink 1.2s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.restpop.paused .hg { transform: rotate(90deg); transition: transform .5s var(--spring); }
.hg svg, .hg-mini svg { width: 100%; height: 100%; overflow: visible; }
.hg-cap { fill: var(--text); }
.hg-glass { fill: color-mix(in srgb, var(--text) 6%, transparent); stroke: var(--text); stroke-width: 2.5; stroke-linejoin: round; }
.hg-sand { fill: var(--yellow); transition: y .9s linear, height .9s linear; }
:root[data-theme="spidey"] .hg-sand { fill: var(--accent); }
.hg-stream { stroke: var(--yellow); stroke-width: 2.5; stroke-dasharray: 3 5; animation: stream .5s linear infinite; }
:root[data-theme="spidey"] .hg-stream { stroke: var(--accent); }
@keyframes stream { to { stroke-dashoffset: -8; } }
.restpill { padding: 6px 16px 6px 8px; gap: 8px; }
.hg-mini { width: 22px; height: 34px; display: block; }
.restpill .hg-cap, .restpill .hg-glass { stroke: #fff; } .restpill .hg-cap { fill: #fff; }
:root:is([data-theme="mono"],[data-theme="spidey"],[data-theme="miles"],[data-theme="cliffs"][data-tod="night"]) .restpill .hg-cap { fill: var(--text); }
:root:is([data-theme="mono"],[data-theme="spidey"],[data-theme="miles"],[data-theme="cliffs"][data-tod="night"]) .restpill .hg-glass { stroke: var(--text); }

/* ---------- Set-complete celebration ---------- */
.cele { position: fixed; z-index: 85; left: 50%; top: 38%; transform: translate(-50%, -50%); width: min(300px, calc(100% - 48px)); display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 18px 20px; border-radius: 26px; background: var(--surface); border: 3px solid var(--accent); box-shadow: 0 6px 0 var(--accent-dark), 0 24px 50px -16px rgba(0,0,0,.5); pointer-events: none; animation: celeIn .6s var(--spring) both, celeOut .35s ease-in 1.85s forwards; }
.cele b { font-size: 34px; font-weight: 900; line-height: 1.05; }
.cele span { font-size: 15px; font-weight: 700; color: var(--text2); }
.cele-low { border-color: var(--blue); box-shadow: 0 6px 0 color-mix(in srgb, var(--blue) 70%, #000), 0 24px 50px -16px rgba(0,0,0,.5); }
.cele-low b { font-size: 26px; }
.cele-nice { border-color: var(--green); box-shadow: 0 6px 0 color-mix(in srgb, var(--green) 70%, #000), 0 24px 50px -16px rgba(0,0,0,.5); }
.cele-great { border-color: var(--yellow); box-shadow: 0 6px 0 color-mix(in srgb, var(--yellow) 70%, #000), 0 24px 50px -16px rgba(0,0,0,.5); }
.cele-amazing { background: var(--accent); color: #fff; border-color: var(--yellow); }
.cele-amazing span { color: inherit; opacity: .85; }
.cele-amazing b { animation: wiggle .6s .3s var(--spring) 2; }
.cele-next { background: var(--yellow); color: #221E2B; border-color: #221E2B; box-shadow: 0 6px 0 #221E2B, 0 24px 50px -16px rgba(0,0,0,.5); animation: celeIn .6s var(--spring) both, celeOut .35s ease-in 2.25s forwards; }
.cele-next span { color: inherit; }
:root[data-theme="mono"] .cele-amazing { color: #0B0B0C; }
@keyframes celeIn { from { transform: translate(-50%, -50%) scale(.3) rotate(-8deg); opacity: 0; } }
@keyframes celeOut { to { transform: translate(-50%, -80%) scale(.9); opacity: 0; } }
@keyframes wiggle { 25% { transform: rotate(-6deg) scale(1.08); } 75% { transform: rotate(6deg) scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .cele { animation: none; } }
#wk:has(.restpop) .wk-body { padding-bottom: calc(330px + env(safe-area-inset-bottom, 0px)); }

.daychip { min-height: 28px; padding: 0 4px; color: var(--text2); font-weight: 800; }
:root[data-theme="cliffs"] .card.nextup::before { display: none; }

.grp { padding: 14px 4px 4px; font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.grp span { opacity: .6; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.mus { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.mus span { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 8px; background: color-mix(in srgb, var(--split, var(--accent)) 16%, transparent); color: var(--text2); }

:root[data-theme="spidey"] #bg .l2 { display: block; left: 0; top: -40px; width: 22px; height: 560px; background: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='40' height='600' viewBox='0 0 40 600'%3E%3Cpath d='M20 0V560' stroke='white' stroke-width='1.6' opacity='.55'/%3E%3Cpath d='M20 560l-12 18M20 560l12 18M20 560l-16 4M20 560l16 4M20 560l-6 22M20 560l6 22' stroke='white' stroke-width='1.6' opacity='.55' stroke-linecap='round'/%3E%3C/svg%3E") center top / 22px 560px no-repeat; transform-origin: top center; animation: swing 6s ease-in-out infinite alternate; }
@keyframes swing { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
:root[data-theme="miles"] .top h1 { animation: glitch 5s steps(1) infinite; }
@keyframes glitch { 0%, 88%, 100% { text-shadow: none; transform: none; } 89% { text-shadow: -3px 0 #E3262E, 3px 0 #7FD8FF; transform: translateX(2px); } 91% { text-shadow: 3px 0 #E3262E, -3px 0 #7FD8FF; transform: translateX(-2px); } 93% { text-shadow: -2px 0 #FFE94D, 2px 0 #E3262E; transform: none; } }
:root[data-theme="spidey"] .top h1, :root[data-theme="miles"] .top h1 { text-shadow: 0 2px 12px rgba(0,0,0,.6); }
@media (prefers-reduced-motion: reduce) { #bg .l1, #bg .l2, .top h1 { animation: none !important; } }

/* ---------- Job Done recap ---------- */
#recap { position: fixed; inset: 0; z-index: 70; overflow-y: auto; background: var(--bg); opacity: 0; transform: translateY(30px); transition: opacity .25s, transform .4s var(--spring); }
#recap.in { opacity: 1; transform: none; }
:root[data-theme="cliffs"] #recap { background: linear-gradient(180deg, var(--sky1, #6FB3E6), var(--sky2, #A9D4EE) 40%, var(--bg) 75%); }
.rc-body { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
.rc-hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 4px; }
.rc-hero h1 { font-size: 44px; animation: popIn .6s .2s var(--spring) both; }
.rc-check { width: 86px; height: 86px; margin-bottom: 8px; animation: popIn .6s var(--spring) both; }
.rc-check svg { width: 100%; height: 100%; }
.rc-check circle { fill: var(--accent); }
.rc-check path { fill: none; stroke: var(--accent-ink, #fff); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .5s .45s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
:root[data-theme="cliffs"] .rc-hero .eyebrow, :root[data-theme="cliffs"] .rc-hero h1, :root[data-theme="cliffs"] .rc-hero .sec { color: #fff; text-shadow: 0 1px 10px rgba(0,0,0,.3); }
.rc-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rc-st { display: flex; flex-direction: column; gap: 2px; padding: 14px 10px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--lift); animation: rise .5s var(--spring) both; }
.rc-st:nth-child(2) { animation-delay: .06s; } .rc-st:nth-child(3) { animation-delay: .12s; } .rc-st:nth-child(4) { animation-delay: .18s; }
.rc-st b { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
.rc-st span { font-size: 12px; font-weight: 700; color: var(--muted); }
.rc-fun { display: flex; align-items: center; gap: 14px; }
.rc-emoji { font-size: 34px; }

<script>
'use strict';
/* JobDone: single-user strength + body tracker. Vanilla JS, no build step.
   Data lives in the artifact's db (synced to Job's claude.ai account) with a localStorage cache. */

// ---------- utils ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());

const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };

const ts = s => parseYmd(s).getTime();
const DAY = 864e5;
const daysBetween = (a, b) => Math.round((ts(b) - ts(a)) / DAY);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fmtDate = (s, o = {}) => { const d = parseYmd(s); return (o.wd ? WD[d.getDay()] + ' ' : '') + d.getDate() + ' ' + MON[d.getMonth()] + (o.y ? ' ' + d.getFullYear() : ''); };
const mondayOf = s => { const d = parseYmd(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return ymd(d); };
const relDay = s => { const n = daysBetween(s, today()); return n === 0 ? 'today' : n === 1 ? 'yesterday' : n < 7 ? n + ' days ago' : fmtDate(s, { wd: true }); };
const fmtDur = ms => { const m = Math.max(0, Math.floor(ms / 6e4)); return m >= 60 ? Math.floor(m / 60) + 'h ' + pad2(m % 60) + 'm' : m + ' min'; };
const clock = s => Math.floor(s / 60) + ':' + pad2(Math.floor(s % 60));
const n0 = v => Math.round(v).toLocaleString('en-US');
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let hapEl = null;
// Android vibrates; iPhone (iOS 18+) gives a light tap when a hidden switch is toggled.
const buzz = ms => {

    if (!hapEl) { hapEl = document.createElement('label'); hapEl.setAttribute('aria-hidden', 'true'); hapEl.style.cssText = 'position:fixed;left:-200px;top:0;opacity:0;pointer-events:none'; hapEl.innerHTML = '<input type="checkbox" switch tabindex="-1">'; document.body.appendChild(hapEl); }

};

// ---------- exercise library ----------
const LIB_RAW = `Chest Fly|Chest|machine;Incline Press|Chest|machine;Bench Press|Chest|barbell;Incline Bench Press|Chest|barbell;Decline Bench Press|Chest|barbell;Dumbbell Bench Press|Chest|dumbbell;Incline Dumbbell Press|Chest|dumbbell;Chest Press|Chest|machine;Smith Bench Press|Chest|smith;Cable Crossover|Chest|cable;Low-to-High Cable Fly|Chest|cable;Dumbbell Fly|Chest|dumbbell;Pec Deck|Chest|machine;Push-Up|Chest|bodyweight;Dip|Chest|bodyweight;
Lat Pulldown|Back|cable;Wide-Grip Row|Back|cable;Close-Grip Row|Back|cable;Seated Cable Row|Back|cable;Barbell Row|Back|barbell;Pendlay Row|Back|barbell;Dumbbell Row|Back|dumbbell;Chest-Supported Row|Back|machine;T-Bar Row|Back|machine;Machine Row|Back|machine;Pull-Up|Back|bodyweight;Chin-Up|Back|bodyweight;Assisted Pull-Up|Back|machine;Straight-Arm Pulldown|Back|cable;Single-Arm Pulldown|Back|cable;Deadlift|Back|barbell;Rack Pull|Back|barbell;Back Extension|Back|bodyweight;Shrug|Back|dumbbell;Face Pull|Shoulders|cable;
Shoulder Press|Shoulders|machine;Overhead Press|Shoulders|barbell;Dumbbell Shoulder Press|Shoulders|dumbbell;Arnold Press|Shoulders|dumbbell;Lateral Raise|Shoulders|cable;Dumbbell Lateral Raise|Shoulders|dumbbell;Machine Lateral Raise|Shoulders|machine;Front Raise|Shoulders|dumbbell;Rear Delt Fly|Shoulders|machine;Reverse Pec Deck|Shoulders|machine;Upright Row|Shoulders|cable;
Preacher Curl|Biceps|machine;Hammer Curl|Biceps|dumbbell;Barbell Curl|Biceps|barbell;EZ-Bar Curl|Biceps|barbell;Dumbbell Curl|Biceps|dumbbell;Incline Dumbbell Curl|Biceps|dumbbell;Cable Curl|Biceps|cable;Bayesian Curl|Biceps|cable;Concentration Curl|Biceps|dumbbell;Spider Curl|Biceps|dumbbell;Forearm Curl|Forearms|cable;Reverse Curl|Forearms|barbell;Wrist Curl|Forearms|dumbbell;Farmer's Carry|Forearms|dumbbell;
Tricep Vulken|Triceps|machine;Single-Arm Tricep|Triceps|cable;Tricep Bar|Triceps|cable;Tricep Pushdown|Triceps|cable;Rope Pushdown|Triceps|cable;Overhead Tricep Extension|Triceps|cable;Skull Crusher|Triceps|barbell;Close-Grip Bench Press|Triceps|barbell;Dumbbell Kickback|Triceps|dumbbell;Tricep Dip Machine|Triceps|machine;
Cable Crunch|Abs|cable;Oblique Crunch|Abs|cable;Hanging Leg Raise|Abs|bodyweight;Ab Wheel|Abs|bodyweight;Crunch Machine|Abs|machine;Plank|Abs|bodyweight;Russian Twist|Abs|bodyweight;Pallof Press|Abs|cable;Woodchopper|Abs|cable;
Leg Press|Quads|machine;Leg Extension|Quads|machine;Back Squat|Quads|barbell;Front Squat|Quads|barbell;Hack Squat|Quads|machine;Smith Squat|Quads|smith;Goblet Squat|Quads|dumbbell;Bulgarian Split Squat|Quads|dumbbell;Walking Lunge|Quads|dumbbell;Pendulum Squat|Quads|machine;Step-Up|Quads|dumbbell;Sissy Squat|Quads|bodyweight;
Stiff-Leg Deadlift|Hamstrings|barbell;Romanian Deadlift|Hamstrings|barbell;Dumbbell RDL|Hamstrings|dumbbell;Leg Curl|Hamstrings|machine;Seated Leg Curl|Hamstrings|machine;Lying Leg Curl|Hamstrings|machine;Nordic Curl|Hamstrings|bodyweight;Good Morning|Hamstrings|barbell;
Hip Thrust|Glutes|barbell;Glute Bridge|Glutes|barbell;Cable Kickback|Glutes|cable;Abductor|Glutes|machine;Glute Drive|Glutes|machine;Adductor|Adductors|machine;Copenhagen Plank|Adductors|bodyweight;
Calf Raise|Calves|machine;Seated Calf Raise|Calves|machine;Standing Calf Raise|Calves|machine;Leg Press Calf Raise|Calves|machine;Donkey Calf Raise|Calves|machine`;
const LIB = LIB_RAW.split(';').map(s => s.trim()).filter(Boolean).map(s => { const [name, muscle, equip] = s.split('|'); return { name, muscle, equip }; });
const EQUIP = ['barbell', 'dumbbell', 'machine', 'cable', 'smith', 'bodyweight', 'band', 'kettlebell', 'other'];
const MUSCLES = ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Forearms', 'Abs', 'Quads', 'Hamstrings', 'Glutes', 'Adductors', 'Calves', 'Other'];
const baseName = n => n.replace(/\s*\((L|R)\)$/, '');
const sideOf = n => (n.match(/\((L|R)\)$/) || [])[1] || null;
function exInfo(name) {
  const b = baseName(name);
  return (S.customEx || []).find(e => e.name === b) || LIB.find(e => e.name === b) || { name: b, muscle: 'Other', equip: 'other' };
}

// ---------- seed data (section 4 + section 10 of the build prompt) ----------
// Personal seed (Job’s log and profile notes) is injected only into the Claude version at build time.
const SEED = /*SEED*/{ log: [], weights: [], moved: [], noname: null, assumptions: [], today: null, profile: {} };
const SEED_LOG = SEED.log;
// The public website build ships without Job's personal log; data arrives by restoring a backup instead.
const PUBLIC = SEED_LOG.length === 0;
const SPLIT_COLORS = { Push: '#FF8A5C', Pull: '#5CB8FF', Upper: '#B38CFF', Legs: '#3DDC97', Anterior: '#FFC94D', Posterior: '#FF6FA8' };
const PALETTE = ['#FF8A5C', '#5CB8FF', '#B38CFF', '#3DDC97', '#FFC94D', '#FF6FA8', '#7EE0E0', '#A1A1AA'];
const SEED_WEIGHTS = SEED.weights, MOVED = SEED.moved, NONAME = SEED.noname, ASSUMPTIONS = SEED.assumptions;

// ---------- state ----------
let LS_KEY = 'jobdone.v1';
// Hosted version (own website): config.js sets window.JOBDONE_CONFIG with Supabase keys.
const CFG = window.JOBDONE_CONFIG || null;
const HOSTED = !!(CFG && CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase);
let SB = null, USER = null;
let S = null;        // persisted app state
let A = null;        // active workout in progress
let UI = { lastPrompt: null };
let NAV = { tab: 'today', stack: [], prog: 'body', range: '6M' };
let IX = null;
let DB = null, DL = null;
let mode = 'pending'; // cloud | local
let syncState = 'ok';
let ready = false;
let REST = null;      // {end, total}
let welcomeOv = {};   // assumption overrides on the welcome screen

function freshState() {
  return {
    v: 1,
    profile: Object.assign({ name: firstName(), heightCm: null, unit: 'kg', stepGoal: 10000, weeklyTarget: 4, defaultRest: 300, sound: true }, SEED.profile),
    splits: [], rotation: [], customEx: [], weights: {}, steps: {}, workouts: {}, imported: false, created: Date.now(),
  };
}
const invalidate = () => { IX = null; };

// ---------- storage ----------
function lsLoad() { try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify({ S, A, UI })); } catch (e) {} }
const dirty = new Set(), inflight = new Set();
let flushT = null;
function persist(...paths) {
  lsSave();
  if (!DB || !S) return;
  paths.forEach(p => dirty.add(p));
  clearTimeout(flushT); flushT = setTimeout(flush, 450);
}
const monthPath = date => 'months/' + date.slice(0, 7);
function flush() {
  for (const p of [...dirty]) {
    if (inflight.has(p)) continue;
    dirty.delete(p); inflight.add(p);
    writeDoc(p).finally(() => { inflight.delete(p); if (dirty.has(p)) { clearTimeout(flushT); flushT = setTimeout(flush, 250); } });
  }
}
async function flushNow() { clearTimeout(flushT); for (const p of [...dirty]) { dirty.delete(p); try { await writeDoc(p); } catch (e) {} } }
function docBody(p) {
  if (p === 'jd/meta') return { v: S.v, profile: S.profile, splits: S.splits, rotation: S.rotation, customEx: S.customEx, imported: S.imported, created: S.created, updated: Date.now() };
  if (p === 'jd/weights') return { e: S.weights };
  if (p === 'jd/steps') return { e: S.steps };
  if (p === 'jd/active') return { a: A || null, t: Date.now() };
  if (p.startsWith('months/')) {
    const m = p.slice(7), w = {};
    for (const x of Object.values(S.workouts)) if (x.date.slice(0, 7) === m) w[x.id] = x;
    return Object.keys(w).length ? { w } : null;
  }
  return null;
}
async function writeDoc(p, attempt = 0) {
  try {
    const body = docBody(p);
    if (body) await DB.doc(p).set(body); else await DB.doc(p).delete();
    if (!dirty.size) setSync('ok');
  } catch (e) {
    const code = e && e.code;
    if ((code === 'unavailable' || code === 'resource_exhausted') && attempt < 5) { await sleep(700 * 2 ** attempt + Math.random() * 400); return writeDoc(p, attempt + 1); }
    setSync('err', code);
  }
}
function setSync(s, code) {
  syncState = s;
  if (s === 'err') toast(code === 'quota_exceeded' ? 'Storage is full. Export your data, then delete old workouts.' : 'Couldn’t save to your account. Your data is kept on this device and will retry.');
}
function allPaths() {
  const months = new Set(Object.values(S.workouts).map(w => monthPath(w.date)));
  return ['jd/meta', 'jd/weights', 'jd/steps', 'jd/active', ...months];
}
async function loadCloud() {
  const [m, w, s, a, months] = await Promise.all([DB.doc('jd/meta').get(), DB.doc('jd/weights').get(), DB.doc('jd/steps').get(), DB.doc('jd/active').get(), DB.collection('months').get()]);
  if (!m.exists) return false;
  const md = clone(m.data());
  const ns = Object.assign(freshState(), { v: md.v, profile: Object.assign(freshState().profile, md.profile), splits: md.splits || [], rotation: md.rotation || [], customEx: md.customEx || [], imported: md.imported, created: md.created });

  ns.steps = s.exists ? clone(s.data().e || {}) : {};

  for (const d of months.docs) Object.assign(ns.workouts, clone(d.data().w || {}));
  const ca = a.exists ? clone(a.data().a || null) : null;
  // keep whichever in-progress workout was touched last
  if (!A || (ca && (ca.touched || 0) > (A.touched || 0))) A = ca;
  else if (A && !ca && a.exists && (a.data().t || 0) > (A.touched || 0)) A = null;
  S = ns; invalidate();
  return true;
}

// ---------- derived index ----------
const e1 = s => s.w * (1 + s.r / 30);
const validSet = s => s && s.w != null && s.r != null && s.r > 0 && s.t !== 'warm';
const setVol = s => (s.w != null && s.r != null && s.t !== 'warm') ? s.w * s.r : 0;
const exVol = sets => sets.reduce((a, s) => a + setVol(s), 0);
function topSet(sets) { let b = null; for (const s of sets) if (validSet(s) && (!b || s.w > b.w || (s.w === b.w && s.r > b.r))) b = s; return b; }
function maxE1(sets) { let m = 0; for (const s of sets) if (validSet(s)) m = Math.max(m, e1(s)); return m; }
const emptyBest = () => ({ maxW: 0, e1: 0, vol: 0, rep: {}, n: 0 });
function prTypes(s, b) {
  if (!validSet(s) || !b || b.n === 0) return [];
  const t = [];
  if (s.w > b.maxW + 1e-9) t.push('Heaviest');
  if (e1(s) > b.e1 + 0.05) t.push('e1RM');
  if (s.w * s.r > b.vol + 1e-9) t.push('Volume');
  if (b.rep[s.w] != null && s.r > b.rep[s.w]) t.push('Reps');
  return t;
}
function applyBest(s, b) {
  if (!validSet(s)) return;
  b.maxW = Math.max(b.maxW, s.w); b.e1 = Math.max(b.e1, e1(s)); b.vol = Math.max(b.vol, s.w * s.r);
  b.rep[s.w] = Math.max(b.rep[s.w] || 0, s.r);
}
const sortW = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.start || 0) - (b.start || 0);
function ix() {
  if (IX) return IX;
  const ws = Object.values(S.workouts).sort(sortW);
  const hist = {}, best = {}, prs = [];
  for (const w of ws) {
    if (w.skipped) continue;
    for (const e of w.ex) {
      const b = best[e.name] || (best[e.name] = emptyBest());
      (hist[e.name] || (hist[e.name] = [])).push({ date: w.date, wid: w.id, sets: e.sets, note: e.note, top: topSet(e.sets), vol: exVol(e.sets), e1: maxE1(e.sets) });
      const types = new Set(); let star = null;
      for (const s of e.sets) { const t = prTypes(s, b); if (t.length) { t.forEach(x => types.add(x)); if (!star || e1(s) > e1(star)) star = s; } }
      if (types.size) prs.push({ date: w.date, wid: w.id, ex: e.name, set: star, types: [...types] });
      e.sets.forEach(s => applyBest(s, b));
      b.n++;
    }
  }
  IX = { ws, hist, best, prs };
  return IX;
}
const lastSession = name => { const h = ix().hist[name]; return h && h.length ? h[h.length - 1] : null; };
const splitById = id => S.splits.find(s => s.id === id);
const wSplit = w => (w.splitId && splitById(w.splitId)) || S.splits.find(s => s.name === w.splitName);
function lastOfSplit(sp) { const ws = ix().ws; for (let i = ws.length - 1; i >= 0; i--) { const w = ws[i]; if (!w.skipped && (w.splitId === sp.id || (!w.splitId && w.splitName === sp.name))) return w; } return null; }
const wVol = w => w.ex.reduce((a, e) => a + exVol(e.sets), 0);
const wSets = w => w.ex.reduce((a, e) => a + e.sets.filter(s => s.t !== 'warm').length, 0);
function nextSplit() {
  const order = S.rotation.map(splitById).filter(s => s && !s.archived);
  if (!order.length) return S.splits.find(s => !s.archived) || null;
  const ws = ix().ws;
  for (let i = ws.length - 1; i >= 0; i--) {
    const w = ws[i]; if (w.skipped) continue;
    const k = order.findIndex(s => s.id === w.splitId || (!w.splitId && s.name === w.splitName));
    if (k >= 0) return order[(k + 1) % order.length];
  }
  return order[0];
}

// ---------- weights ----------
const weightList = () => Object.entries(S.weights).map(([d, e]) => ({ d, w: e.w, src: e.src })).sort((a, b) => a.d < b.d ? -1 : 1);
const bwRaw = v => (v < 0 ? '−' : '') + Math.abs(v).toFixed(1);
function firstWeight() { const l = weightList(); return l.length ? l[0] : null; }
function latestWeight() { const l = weightList(); return l.length ? l[l.length - 1] : null; }
function weightOn(date) { let r = null; for (const e of weightList()) { if (e.d <= date) r = e; else break; } return r; }
function avg7(date = today()) {
  const l = weightList().filter(e => e.d <= date && daysBetween(e.d, date) < 7);
  return l.length ? l.reduce((a, e) => a + e.w, 0) / l.length : null;
}
function trendSeries(list) {
  const out = []; let t = null, pd = null;
  for (const e of list) {
    if (t == null) t = e.w; else { const k = 1 - Math.exp(-Math.max(1, daysBetween(pd, e.d)) / 10); t = t + k * (e.w - t); }
    pd = e.d; out.push({ x: ts(e.d), y: t });
  }
  return out;
}

// ---------- units ----------
const LB = 2.20462;
const U = () => S.profile.unit;
const trim = v => String(+(+v).toFixed(2));
function dw(kg) { if (kg == null) return '?'; return U() === 'lb' ? trim(Math.round(kg * LB * 10) / 10) : trim(Math.round(kg * 100) / 100); }
const toKg = v => U() === 'lb' ? v / LB : v;
const dvol = kg => n0(U() === 'lb' ? kg * LB : kg);
const setStr = s => s ? dw(s.w) + '×' + (s.r == null ? '?' : s.r) : '—';
function delta(a, b, fmt = v => trim(v), unit = '') {
  if (a == null || b == null) return '';
  const d = a - b;
  if (Math.abs(d) < 1e-6) return `<span class="neu">= ${fmt(0)}${unit}</span>`;
  return `<span class="${d > 0 ? 'pos' : 'neg'}">${d > 0 ? '▲' : '▼'} ${fmt(Math.abs(d))}${unit}</span>`;
}
const fmtW = v => dw(v);
// body weight: always one decimal, real minus sign
function bw(kg, signed) { if (kg == null) return '—'; const v = U() === 'lb' ? kg * LB : kg; const t = Math.abs(v).toFixed(1); return (v < -0.05 ? '−' : signed && v > 0.05 ? '+' : '') + t; }
const e1f = kg => kg ? trim(Math.round((U() === 'lb' ? kg * LB : kg) * 10) / 10) : '—';
function wdelta(a, b) { if (a == null || b == null) return ''; const d = a - b; if (Math.abs(d) < 0.05) return '<span class="neu">= 0.0</span>'; return `<span class="sec">${d > 0 ? '▲' : '▼'} ${bw(Math.abs(d))}</span>`; }

function progHistory() {

// ---------- active workout ----------
function newExEntry(name, nSets, rest, tip) {
  const last = lastSession(name);
  const src = last ? last.sets : [];
  const n = Math.max(nSets || 0, src.length) || 2;
  const sets = [];
  for (let i = 0; i < n; i++) {
    const p = src[i] || src[src.length - 1];
    sets.push({ w: p ? p.w : null, r: p ? p.r : null, t: 'work', done: false });
  }
  return { name, rest: rest || S.profile.defaultRest, tip: tip || '', note: '', sets, key: uid() };
}
function startWorkout(splitId, date) {
  if (A) { openWk(); return; }
  const sp = splitId ? splitById(splitId) : null;
  A = { id: uid(), splitId: sp ? sp.id : null, splitName: sp ? sp.name : 'Workout', start: Date.now(), touched: Date.now(), ex: sp ? sp.ex.map(e => newExEntry(e.name, e.sets, e.rest, e.note)) : [], orig: sp ? sp.ex.map(e => e.name) : [], view: 'log' };
  if (date && date !== today()) A.date = date;
  persist('jd/active'); openWk();
  if (!sp) pickExercise(name => { A.ex.push(newExEntry(name)); touchA(); });
}

      ${['7', '8', '9'].map(k => `<button data-k="${k}">${k}</button>`).join('')}<button class="q" data-q="${q[2]}">${q[2]}</button>
      <button data-k="." ${f === 'r' ? 'disabled style="opacity:.3"' : ''}>.</button><button data-k="0">0</button><button data-k="del" aria-label="Delete">⌫</button><button class="q" data-q="${q[3]}">+${q[3]}</button>
      <button class="q" data-k="next" style="grid-column:span 2">${f === 'w' ? 'Reps →' : 'Next set →'}</button><button class="done" data-k="done" style="grid-column:span 2">Done</button>
    </div></div>`;

  const lo = Math.max(20, Math.floor(val - 15)), hi = Math.ceil(val + 15);
  const n = Math.round((hi - lo) * 10) + 1;
  let ticks = ''; for (let i = 0; i < n; i++) { const v = lo + i / 10; const m = i % 10 === 0; ticks += `<i class="${m ? 'm' : ''}">${m ? `<b>${Math.round(v)}</b>` : ''}</i>`; }
  const isToday = date === today();
  const sh = openSheet(`<div class="stack" style="gap:14px">
    <div><div class="eyebrow">${isToday ? 'Morning weigh-in' : 'Weight entry'}</div>${isToday ? '' : `<input class="input" type="date" id="wi-date" value="${date}" style="margin-top:8px">`}</div>
    <div class="row between"><button class="icon-btn" data-wd="-1" aria-label="Decrease by 0.1" style="font-size:24px;background:var(--surface)">−</button><div class="big" style="text-align:center" id="wi-val">${val.toFixed(1)}<span class="unit">${U()}</span></div><button class="icon-btn" data-wd="1" aria-label="Increase by 0.1" style="font-size:24px;background:var(--surface)">+</button></div>
    <div style="position:relative"><div class="ruler" id="wi-ruler"><div class="ruler-in">${ticks}</div></div><span class="ruler-mark"></span></div>
    <button class="btn primary block" id="wi-save">Save</button>
    ${prompt ? `<button class="btn ghost block" id="wi-skip">Skip today</button>` : ex ? `<button class="btn ghost block danger" id="wi-del">Delete this entry</button>` : `<button class="btn ghost block" data-a="closeSheet">Cancel</button>`}
  </div>`, {
    label: 'Weigh-in',
    onClose: () => { if (prompt) { UI.lastPrompt = today(); lsSave(); } },
    mount: (b) => {
      const r = b.querySelector('#wi-ruler'), inner = b.querySelector('.ruler-in');
      const setPad = () => { const p = r.clientWidth / 2 - 6; inner.style.padding = `0 ${p}px`; };
      const show = () => { b.querySelector('#wi-val').firstChild.textContent = val.toFixed(1); };
      const scrollTo = (smooth) => r.scrollTo({ left: Math.round((val - lo) * 10) * 12, behavior: smooth ? 'smooth' : 'auto' });
      requestAnimationFrame(() => { setPad(); scrollTo(false); });
      let raf = null, lastI = null;
      r.addEventListener('scroll', () => { if (raf) return; raf = requestAnimationFrame(() => { raf = null; const i = Math.round(r.scrollLeft / 12); if (i !== lastI) { lastI = i; val = Math.round((lo + i / 10) * 10) / 10; show(); buzz(3); } }); }, { passive: true });
      b.querySelectorAll('[data-wd]').forEach(x => x.onclick = () => { val = Math.round((val + 0.1 * x.dataset.wd) * 10) / 10; show(); scrollTo(true); });
      b.querySelector('#wi-save').onclick = () => {
        const d = (b.querySelector('#wi-date') || {}).value || date;
        const kg = Math.round(toKg(val) * 100) / 100;
        const prev = weightOn(addDays(d, -1));
        if (d !== date && S.weights[date] && ex) delete S.weights[date];
        S.weights[d] = { w: kg, src: 'manual' };
        UI.lastPrompt = today(); persist('jd/weights'); closeSheet(sh); rerender();
        const a7 = avg7(d);
        toast(`<b class="num">${bw(kg)} ${U()}</b> · ${prev ? wdelta(kg, prev.w) + ' vs last' : 'logged'} · 7-day avg <span class="num">${a7 ? bw(a7) : '—'}</span>`, 3200);
      };
      const sk = b.querySelector('#wi-skip'); if (sk) sk.onclick = () => { closeSheet(sh); };
      const dl = b.querySelector('#wi-del'); if (dl) dl.onclick = () => { delete S.weights[date]; persist('jd/weights'); closeSheet(sh); rerender(); toast('Entry deleted'); };
    },
  });
}

// ---------- steps ----------
function parseStepText(txt) {
  const out = {};
  for (const line of txt.split(/\r?\n/)) {
    const L = line.trim(); if (!L) continue;
    let d = null; const iso = L.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (iso) d = iso[0];
    else { const p = Date.parse(L.replace(/\s+[\d,.]+\s*(steps?)?\s*$/i, '').replace(/\bat\b.*$/i, '')); if (!isNaN(p)) d = ymd(new Date(p)); }
    const nm = L.replace(iso ? iso[0] : '', '').match(/([\d][\d,.]*)\s*(steps?)?\s*$/i);
    if (d && nm) { const v = Math.round(parseFloat(nm[1].replace(/,/g, ''))); if (v >= 0 && v < 200000) out[d] = (out[d] || 0) + v; }
  }
  return out;
}
function openSyncKey() {
  const url = CFG.supabaseUrl.replace(/\/$/, '') + '/functions/v1/steps';
  openSheet(`<div class="stack"><div class="eyebrow">Steps sync key</div>
    <p class="sec" style="margin:0;font-size:14px">A new key replaces any key you made before, so an old Shortcut stops working until you paste the new key in. JobDone shows the key only once.</p>
    <div id="sk-out"></div>
    <button class="btn primary block" id="sk-make">Create key</button>
    <button class="btn ghost block" data-a="closeSheet">Close</button></div>`, { label: 'Steps sync key', mount: el => {
  el.querySelector('#sk-make').onclick = async ev => {
    const b = ev.currentTarget; b.disabled = true;
    try {
      const raw = crypto.getRandomValues(new Uint8Array(32));
      const key = btoa(String.fromCharCode(...raw)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(key));
      const key_hash = [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join('');
      const { error } = await SB.from('jobdone_sync_keys').upsert({ user_id: USER.id, key_hash, created_at: new Date().toISOString() });
      if (error) throw error;
      b.remove();
      el.querySelector('#sk-out').innerHTML = `<div class="stack" style="gap:10px">
        <div class="field"><label>Your key</label><textarea class="input num" readonly rows="2" style="min-height:0">${esc(key)}</textarea></div>

      for (const c of el.querySelectorAll('[data-copy]')) c.onclick = async () => { try { await navigator.clipboard.writeText(c.dataset.copy); toast('Copied'); } catch (e) { toast('Press and hold the text to copy it'); } };

function pickExercise(onPick, opts = {}) {
  let q = '', mf = null;
  const recent = []; for (const w of ix().ws.slice().reverse()) for (const e of w.ex) { const b = baseName(e.name); if (!recent.includes(b)) recent.push(b); }
  const all = () => { const names = new Set([...LIB.map(e => e.name), ...(S.customEx || []).map(e => e.name)]); return [...names].map(exInfo); };
  const score = (n, q) => { n = n.toLowerCase(); q = q.toLowerCase().trim(); if (!q) return 1; if (n.includes(q)) return 100 - n.indexOf(q); let i = 0; for (const c of n) if (c === q[i]) i++; return i === q.length ? 10 : 0; };
  const list = () => {
    let l = all().filter(e => !mf || e.muscle === mf).map(e => ({ e, s: score(e.name, q) })).filter(x => x.s > 0);
    l.sort((a, b) => b.s - a.s || (recent.indexOf(a.e.name) + 1 || 999) - (recent.indexOf(b.e.name) + 1 || 999) || a.e.name.localeCompare(b.e.name));
    return l.map(x => x.e);
  };
  const rows = () => {
    const l = list(); const exact = l.some(e => e.name.toLowerCase() === q.trim().toLowerCase());

        + (rec.length ? `<div class="grp">Recent</div>` + rec.map(row).join('') : '')
        + MUSCLES.map(m => { const g = all2.filter(e => e.muscle === m).sort((a, b) => a.name.localeCompare(b.name)); return g.length ? `<div class="grp">${esc(m)} <span>${g.length}</span></div>` + g.map(row).join('') : ''; }).join('');
    }
    return (q.trim() && !exact ? `<button class="li" data-pick-new="1"><div class="grow"><div class="t">Create “${esc(q.trim())}”</div><div class="s">Custom exercise${mf ? ' · ' + esc(mf) : ''}</div></div>${I.plus.replace('<svg', '<svg width="18" height="18"')}</button>` : '') +
      l.slice(0, 80).map(e => `<button class="li" data-pick="${esc(e.name)}"><div class="grow"><div class="t">${esc(e.name)}</div><div class="s">${esc(e.muscle)} · ${esc(e.equip)}${recent.includes(e.name) ? ' · used before' : ''}</div></div></button>`).join('');
  };
  const sh = openSheet(`<div class="stack"><div class="eyebrow">${esc(opts.title || 'Add exercise')}</div><input class="input" id="pk-q" placeholder="Search exercises" autocomplete="off">
    <div class="chips" id="pk-m">${MUSCLES.map(m => `<button class="chip" data-m="${m}">${m}</button>`).join('')}</div>
    <label class="row cap" style="gap:8px"><input type="checkbox" id="pk-side" style="accent-color:var(--accent)"> Log left and right sides separately</label>
    <div class="list" id="pk-list">${rows()}</div></div>`, {
    label: 'Exercise picker',
    mount: b => {
      const L = b.querySelector('#pk-list');
      b.querySelector('#pk-q').oninput = ev => { q = ev.target.value; L.innerHTML = rows(); };
      b.querySelector('#pk-m').onclick = ev => { const c = ev.target.closest('[data-m]'); if (!c) return; mf = mf === c.dataset.m ? null : c.dataset.m; b.querySelectorAll('#pk-m .chip').forEach(x => x.classList.toggle('on', x.dataset.m === mf)); L.innerHTML = rows(); };
      L.onclick = ev => {
        const p = ev.target.closest('[data-pick]'), nw = ev.target.closest('[data-pick-new]');
        let name = null;
        if (p) name = p.dataset.pick;
        if (nw) { const sides = b.querySelector('#pk-side').checked; openExForm(q.trim().replace(/\s+/g, ' '), { muscle: mf, onSave: n => { closeSheet(sh); if (sides) { onPick(n + ' (L)'); onPick(n + ' (R)'); } else onPick(n); } }); return; }

        closeSheet(sh);

// ---------- welcome / import ----------
function findSeedIdx(d, s) { return SEED_LOG.findIndex(o => o.d === d && o.s === s); }
function buildFromSeed() {
  const log = SEED_LOG.map((o, i) => { const ov = welcomeOv[i] || {}; return { ...o, d: ov.d || o.d, s: ov.s || o.s }; });
  const st = buildFromLog(log);
  for (const [d, w] of SEED_WEIGHTS) st.weights[d] = { w, src: 'estimated' };
  if (SEED.today) st.weights[SEED.today[0]] = { w: SEED.today[1], src: 'manual' };
  return st;
}
// log: [{d, s, skip, x: [[exercise, [[w, r], ...], note], ...]}] → state with splits built from each split's latest session
function buildFromLog(log) {
  const st = freshState();
  const names = [...new Set(log.map(o => o.s))];
  const order = ['Push', 'Pull', 'Upper', 'Legs', 'Anterior', 'Posterior'];
  names.sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
  for (const n of names) {

// ---------- CSV import / export ----------
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function csvToWorkouts(text) {
  const rows = parseCSV(text); if (rows.length < 2) return { err: 'That file has no rows.' };
  const h = rows[0].map(x => x.trim().toLowerCase());
  const col = (...names) => { for (const n of names) { const i = h.indexOf(n); if (i >= 0) return i; } return -1; };
  const c = { date: col('date', 'start_time'), split: col('split', 'split_name', 'workout name', 'title'), ex: col('exercise', 'exercise name', 'exercise_title'), w: col('weight_kg', 'weight', 'weight (kg)'), r: col('reps'), note: col('notes', 'note', 'exercise_notes') };
  if (c.date < 0 || c.ex < 0) return { err: 'Couldn’t find date and exercise columns. Expected JobDone, Strong or Hevy CSV headers.' };
  const map = {};
  for (const r of rows.slice(1)) {
    const raw = (r[c.date] || '').trim(); let d = (raw.match(/\d{4}-\d{2}-\d{2}/) || [])[0];
    if (!d) { const p = Date.parse(raw); if (!isNaN(p)) d = ymd(new Date(p)); }
    if (!d) continue;
    const sp = c.split >= 0 ? (r[c.split] || '').trim() || 'Workout' : 'Workout';
    const key = d + '|' + sp; const w = map[key] || (map[key] = { date: d, splitName: sp, ex: [], skipped: false });
    const ex = (r[c.ex] || '').trim();
    if (!ex) { if (/skip/i.test(r[c.note] || '')) w.skipped = true; continue; }
    let e = w.ex[w.ex.length - 1]; if (!e || e.name !== ex) { e = { name: ex, note: '', sets: [] }; w.ex.push(e); }
    const wt = parseFloat(r[c.w]), rp = parseInt(r[c.r], 10);
    e.sets.push({ w: isNaN(wt) ? null : wt, r: isNaN(rp) ? null : rp, t: 'work' });
    const nt = c.note >= 0 ? (r[c.note] || '').trim() : ''; if (nt && !e.note) e.note = nt;
  }
  return { list: Object.values(map) };
}
